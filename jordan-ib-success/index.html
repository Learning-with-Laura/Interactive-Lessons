<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Success Lab | Learning with Laura</title><style>
:root{--ink:#283455;--violet:#6552bc;--light:#f0f2ff;--mint:#d5f7e8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eff1ff,#eaf9ff);font:17px system-ui,-apple-system,sans-serif;color:var(--ink)}header{background:linear-gradient(110deg,#334789,#7056b5);color:white;padding:28px max(calc((100% - 890px)/2),24px)}header h1{margin:0;font-size:2rem}header p{margin:8px 0 18px}progress{width:100%;height:14px;accent-color:#8ee9cd}main{max-width:890px;margin:24px auto;padding:0 16px 36px}.card{background:#fff;border-radius:22px;padding:32px;box-shadow:0 9px 32px #27375b1a}.kicker{color:#7056b5;font-weight:800;letter-spacing:.04em}.choice{display:block;width:100%;margin:10px 0;padding:14px 16px;text-align:left;background:#f5f5ff;border:2px solid #d9dcf1;border-radius:13px;font:inherit;color:var(--ink);cursor:pointer}.choice:hover{border-color:var(--violet)}.selected{background:#e4dcff;border-color:var(--violet)}.good{background:#d9f6e1;border-color:#27a66b}.bad{background:#ffe2e0;border-color:#d96363}label{display:block;margin-top:18px;font-weight:650}textarea,input{display:block;width:100%;margin:8px 0 16px;padding:12px;border:2px solid #d6d9ed;border-radius:11px;font:inherit;color:var(--ink)}textarea{min-height:95px;resize:vertical}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button.navbtn{font:inherit;background:#fff;color:#433b77;border:1px solid #d4d7eb;border-radius:12px;padding:10px 15px;cursor:pointer}.navbtn.primary{background:var(--violet);color:#fff}.notice{background:#eef8ff;padding:15px 18px;border-radius:12px;border-left:5px solid #68b1dd}.feedback{font-weight:700;margin:10px 0}.small{font-size:14px;color:#59627b}h2{font-size:1.5rem}h3{margin:20px 0 8px}.pills{display:flex;flex-wrap:wrap;gap:5px}footer{margin-top:20px;font-size:13px;color:#59627b}@media(max-width:600px){.card{padding:20px}header h1{font-size:1.5rem}}</style></head>
<body><header><h1>🚀 IB Success Lab</h1><p>Think analytically. Plan realistically. Start confidently.</p><progress id="progress" value="1" max="7"></progress><div id="count" aria-live="polite">Section 1 of 7 • 90-minute session</div></header>
<main><section class="card" id="content"></section><nav class="nav" id="nav" aria-label="Lesson navigation"></nav><footer>Learning with Laura • Practice scenarios and deadlines are fictional. Responses remain on this device unless downloaded and shared.</footer></main>
<script>
const sections=[
{title:"🎯 Check in: your IB workload",time:"10 minutes",html:\`<p>Start with what's really happening this week. A useful plan begins with accurate information.</p><h3>How does your workload feel?</h3><div data-pick="workload"><button class="choice">🟢 Manageable</button><button class="choice">🟡 Busy</button><button class="choice">🟠 Piling up</button><button class="choice">🔴 Overwhelming</button></div><h3>Which course needs the most attention?</h3><div data-pick="focusCourse"><button class="choice">HL Psychology</button><button class="choice">HL Biology</button><button class="choice">SL Chemistry</button><button class="choice">Core French</button></div><label>What assignment or expectation feels unclear?</label><textarea data-field="unclear" placeholder="A sentence or two is enough."></textarea><label>What is one thing you've handled well recently?</label><textarea data-field="success" placeholder="Think about independent work, asking a question, or getting started."></textarea>\`},
{title:"🧠 Read like an HL Psychology student",time:"15 minutes",html:\`<div class="notice"><strong>Fictional study:</strong> Thirty students studied 15 words with music, and thirty studied in silence. The music group recalled an average of 11 words; the silence group recalled 9. Students selected their preferred condition.</div><h3>What can we conclude?</h3><div data-quiz="q1" data-answer="2"><button class="choice">Music definitely caused better recall.</button><button class="choice">Studying in silence harms memory.</button><button class="choice">The music group recalled more, but causation is uncertain.</button><button class="choice">Music helps every student.</button></div><label>What detail in the research method matters most?</label><textarea data-field="method"></textarea><label>Name a possible confounding variable.</label><textarea data-field="confound"></textarea><label>How would you redesign the study?</label><textarea data-field="redesign"></textarea>\`},
{title:"🔎 Compare interpretations, then form your own",time:"15 minutes",html:\`<p><strong>Classmate A:</strong> “The data prove music helps people memorize.”</p><p><strong>Classmate B:</strong> “The difference is interesting, but students selecting their own conditions weakens the causal claim.”</p><h3>Which interpretation is better supported?</h3><div data-quiz="q2" data-answer="1"><button class="choice">A: It follows directly from the averages.</button><button class="choice">B: It considers a limitation in the method.</button><button class="choice">Both are equally well supported.</button></div><label>Your response: claim + evidence + limitation</label><textarea data-field="interpretation" placeholder="I think... The evidence is... However..."></textarea><label>What could you learn from classmates without replacing your own judgement?</label><textarea data-field="peerLearning"></textarea><p class="small">Coaching prompt: Does your response describe what the data show, or something the data do not prove?</p>\`},
{title:"🧩 Begin a demanding task before avoidance starts",time:"15 minutes",html:\`<div class="notice"><strong>Scenario:</strong> A Biology report is due in eight days. You have collected results but haven't begun writing. The instructions feel overwhelming.</div><h3>What should happen first?</h3><div data-quiz="q3" data-answer="1"><button class="choice">Wait until you feel motivated.</button><button class="choice">Open the rubric, identify sections, and create a document.</button><button class="choice">Stay up late and finish everything tonight.</button></div><label>What would you clarify with your teacher before proceeding?</label><textarea data-field="teacherQuestion"></textarea><label>Choose an actual assignment you need to start.</label><input data-field="actualAssignment" placeholder="Course + task"><label>What is the first five-minute action?</label><textarea data-field="fiveMinutes"></textarea><label>How will you know you have completed that action?</label><textarea data-field="doneDefinition"></textarea>\`},
{title:"📅 Plan starts, not only deadlines",time:"15 minutes",html:\`<div class="notice"><strong>Example only:</strong> Psychology reading Wednesday; Chemistry quiz Thursday; Biology draft Friday; French oral Monday. These are practice deadlines, not your real timetable.</div><h3>Which calendar strategy is strongest?</h3><div data-quiz="q4" data-answer="2"><button class="choice">Record due dates only.</button><button class="choice">Do whichever task feels easiest each night.</button><button class="choice">Record start times, preparation stages, due dates, and alerts.</button></div><label>Your real upcoming deadline</label><input data-field="realDeadline" placeholder="Assignment / test / course"><label>Due date</label><input type="date" data-field="dueDate"><label>When will you begin?</label><input type="datetime-local" data-field="startDate"><label>What smaller stages need calendar time?</label><textarea data-field="stages" placeholder="For example: read rubric → outline → first draft → check quality"></textarea><label>What's your restart plan if you miss a session?</label><textarea data-field="restart"></textarea><p class="small">After this activity, enter your real plan into Apple Calendar on your phone.</p>\`},
{title:"🎤 Practise a presentation actively",time:"10 minutes",html:\`<h3>Which practice method reveals missing understanding?</h3><div data-quiz="q5" data-answer="1"><button class="choice">Read your notes silently again and again.</button><button class="choice">Explain aloud without notes, then check accuracy.</button><button class="choice">Memorize your opening word for word.</button></div><div class="notice"><strong>Two-minute speaking task:</strong> Explain correlation versus causation to a Grade 9 student. Give a concrete example. Do not look at your notes while speaking.</div><label>What idea was hardest to explain clearly?</label><textarea data-field="speakingGap"></textarea><label>How would you practise your next presentation differently?</label><textarea data-field="presentationStrategy"></textarea>\`},
{title:"🏁 Your next 48 hours",time:"10 minutes",html:\`<p>Finish with a plan that is realistic enough to act on.</p><label>My most important next action is...</label><textarea data-field="nextAction"></textarea><label>I will do it at this time and place...</label><input data-field="whenWhere" placeholder="Day, time, location"><label>If I get stuck, I will...</label><textarea data-field="ifStuck"></textarea><h3>Confidence check</h3><div data-pick="confidence"><button class="choice">1–2: Not confident yet</button><button class="choice">3: Somewhat confident</button><button class="choice">4–5: Confident</button></div><label>What would increase your confidence by one point?</label><textarea data-field="confidenceBoost"></textarea><p><button class="navbtn primary" id="download" type="button">⬇ Download my completed answers</button></p><p class="small">Share your downloaded responses with Laura only if you choose.</p>\`}
];
let state={};try{state=JSON.parse(localStorage.getItem("ib-success-lab-v1")||"{}")}catch(_){}let current=0;function save(){localStorage.setItem("ib-success-lab-v1",JSON.stringify(state))}
function render(){let item=sections[current];document.getElementById("content").innerHTML='<div class="kicker">'+item.time+'</div><h2>'+item.title+'</h2>'+item.html;document.getElementById("progress").value=current+1;document.getElementById("count").textContent="Section "+(current+1)+" of 7 • 90-minute session";document.querySelectorAll("[data-field]").forEach(el=>{el.value=state[el.dataset.field]||"";el.addEventListener("input",()=>{state[el.dataset.field]=el.value;save()})});document.querySelectorAll("[data-pick]").forEach(group=>{[...group.querySelectorAll("button")].forEach(b=>{if(state[group.dataset.pick]===b.textContent)b.classList.add("selected");b.onclick=()=>{state[group.dataset.pick]=b.textContent;save();group.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}})});document.querySelectorAll("[data-quiz]").forEach(group=>{const buttons=[...group.querySelectorAll("button")];buttons.forEach((b,i)=>{if(state[group.dataset.quiz]===i)b.classList.add(i===Number(group.dataset.answer)?"good":"bad");b.onclick=()=>{state[group.dataset.quiz]=i;save();buttons.forEach(x=>x.classList.remove("good","bad"));b.classList.add(i===Number(group.dataset.answer)?"good":"bad");let f=group.querySelector(".feedback");if(!f){f=document.createElement("p");f.className="feedback";group.appendChild(f)}f.textContent=i===Number(group.dataset.answer)?"✓ Good reasoning. Explain why that answer fits.":"Look closely at what the evidence supports. Try another answer."}})});let n=document.getElementById("nav");n.innerHTML='<button class="navbtn" data-go="'+(current-1)+'" '+(current===0?"disabled":"")+'>← Previous</button>'+sections.map((_,i)=>'<button class="navbtn '+(i===current?"primary":"")+'" data-go="'+i+'">'+(i+1)+'</button>').join("")+'<button class="navbtn primary" data-go="'+(current+1)+'" '+(current===6?"disabled":"")+'>Next →</button>';n.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const next=Number(b.dataset.go);if(next>=0&&next<sections.length){current=next;render();window.scrollTo(0,0)}});const dl=document.getElementById("download");if(dl)dl.onclick=()=>{const report="IB Success Lab • Completed responses\n\n"+Object.entries(state).map(([k,v])=>k+": "+v).join("\n\n");const blob=new Blob([report],{type:"text/plain"});const a=document.createElement("a");const url=URL.createObjectURL(blob);a.href=url;a.download="IB-Success-Lab-Responses.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
render();
</script></body></html>
