<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daniel's Halloween Homework Escape | Learning with Laura</title><style>
:root{--ink:#291d42;--orange:#f7a43a;--purple:#6b43b4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#180d2e,#46206b);color:white;font:17px system-ui,sans-serif}header,main{max-width:920px;margin:auto;padding:24px}h1{font-size:clamp(27px,5vw,42px);margin-bottom:8px}progress{width:100%;height:17px;accent-color:#fbb94b}.card{background:#fff;color:var(--ink);padding:clamp(18px,4vw,32px);border-radius:24px;box-shadow:0 14px 35px #0004}.choice,.chip{border:2px solid #d8c9f3;background:#f6f0ff;color:var(--ink);border-radius:13px;padding:13px;margin:6px 0;font:inherit;cursor:pointer}.choice{display:block;width:100%;text-align:left}.selected{background:#ffe1ad;border-color:#d8791b}.task{background:#f8f5ff;padding:16px;border-radius:15px;margin:20px 0}textarea,input{font:inherit;border:2px solid #d3c5e7;border-radius:12px;padding:12px;width:100%;margin:8px 0}textarea{min-height:110px;resize:vertical}label{font-weight:700;display:block;margin-top:15px}.sortable{list-style:none;padding:0}.sortable li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #d8c9f3;border-radius:12px;padding:10px;margin:7px 0;cursor:grab}.sortable li.dragging{opacity:.45}.sortable li span{flex:1}.sortbtn{font:inherit;border:1px solid #c6b4e9;border-radius:8px;background:#eee6fc;padding:7px 12px;cursor:pointer}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.nav button,.download{border:0;border-radius:12px;background:var(--orange);color:#27162c;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.nav button:disabled{opacity:.4}.note{background:#fff2d7;padding:14px;border-radius:12px;margin:18px 0}.small{font-size:14px;opacity:.9}.muted{color:#625778}.pill{display:inline-block;background:#f2e9ff;border-radius:20px;padding:6px 12px;margin:4px}.feedback{font-weight:700;color:#4c337c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.bucket{min-height:110px;background:#f8f5ff;border:2px dashed #ae95d8;border-radius:12px;padding:12px}.bucket h3{margin:0 0 10px}.tag{display:block;padding:9px;border:1px solid #a78ccf;background:#fff;border-radius:9px;margin:5px 0;cursor:grab}.tag button{float:right;cursor:pointer}.warning{color:#614111;background:#fff1c9;padding:12px;border-radius:10px}</style></head><body><header><h1>🎃 Daniel's Halloween Homework Escape</h1><p>Learning with Laura · Executive Functioning Adventure</p><progress id="progress" max="10" value="1"></progress><p id="counter"></p></header><main><section class="card"><h2 id="heading"></h2><p id="description"></p><div id="activity"></div><div class="nav"><button id="back">← Back</button><button id="next">Next mission →</button></div></section><p class="small">Practice preview: Responses stay in this open browser tab only and are not sent to Firebase. Do not enter personal or sensitive information. Teacher dashboard and secure saving are not yet connected.</p></main><script>
const missions=[{"title":"📚 School Survival Dashboard: Four-Course Check-In","desc":"Check what's happening in each Grade 11 course. Use actual dates and marks if you know them; otherwise write 'not sure' and make a plan to check.","courses":["Physics","English","Communications Technology","Chemistry"],"write":[["Which course needs your attention first, and why?","Use your upcoming deadlines, understanding and workload to decide."],["What is one school success from this week?","It can be a completed task, a question you asked or a strong start."]]},
{title:"🎃 The Five-Minute Mystery",desc:"Investigate what really happened when you tried starting homework before Roblox or YouTube.",pick:[["Over the last five school days, on how many days did you try the five-minute homework start?","0","1","2","3","4","5"],["What happened once you started?","I kept going","I stopped after five minutes","I got distracted","I didn't begin"]],write:[["Think back over the last five school days. What happened when you got home?","Describe when you started homework, when you used Roblox or YouTube, and what helped or got in the way."],["Why is getting started easier at school than at home?","Think about your environment, routines and distractions."],["Looking back at those five school days, what would you change next week?","Explain one practical adjustment."]]},
{title:"👻 Procrastination Detective",desc:"Identify the thought, feeling and action behind avoidance.",pick:[["Which thought is most familiar?","I'll start later","This will take too long","I don't know where to begin","I need a break first"],["What is a useful response to that thought?","Choose one tiny action","Wait until motivation appears","Ignore the assignment","Start gaming without a stopping point"]],write:[["Describe a recent time you delayed starting.","What were you thinking? What did you do instead?"],["Rewrite that thought as a helpful instruction to yourself.","Example: I only need to open the assignment and read the first question."]]},
{title:"🧟 Escape the Distraction Zone",desc:"Put the after-school routine in an order you could realistically follow.",sort:{id:"routine",items:["Arrive home and put away school things","Have a snack and take a planned short break","Open the chosen assignment and set up materials","Work on the first five-minute action","Decide whether to continue or schedule another block","Enjoy gaming or YouTube during planned free time"]},write:[["Why did you choose this order?","Explain how it balances rest, schoolwork and gaming."],["What might interrupt this routine?","Give one realistic obstacle and a solution."]]},
{title:"🧪 The Assignment Breakdown Lab",desc:"A major assignment feels overwhelming. Put the steps in a workable order, then apply the strategy to your own work.",sort:{id:"assignment",items:["Read the assignment instructions and rubric","Identify what must be submitted and when","List the smaller pieces of work","Choose the first five-minute action","Complete a first work block","Review progress and plan the next block"]},write:[["Choose a real school assignment.","Include the subject and what you need to produce."],["Write the first three small steps you will take.","Make each step specific enough to start without guessing."],["What would count as a successful five-minute start?","Finishing the whole assignment is not required."]]},
{title:"🕸️ The Time-Estimation Lab",desc:"Plan realistically rather than assuming everything will be quick.",pick:[["Three tasks take 10, 15 and 20 minutes. How long altogether?","35 minutes","45 minutes","55 minutes"],["You predicted 20 minutes but needed 35. What is the difference?","10 minutes","15 minutes","25 minutes"],["Which plan is more realistic?","Allow time for steps and interruptions","Ignore breaks and transitions","Estimate everything at five minutes"]],write:[["Estimate how long a real assignment will take.","Break it into at least three steps with estimated minutes."],["What could make it take longer?","Explain how you would adjust your plan."]]},
{title:"🔮 Priority Sorting: The Haunted Deadline Board",desc:"Move each fictional task into the most useful priority group. Tap a category or drag the task to a box.",bucket:{id:"priorities",groups:["Do first","Schedule soon","Can wait"],items:["Math practice due tomorrow","Science project due next week","Optional club poster with no deadline","English paragraph due tonight","Review notes for a quiz in four days"]},write:[["Explain one of your priority decisions.","Why does that task belong in that group?"],["Which real assignment should you prioritize this week?","Explain your choice."]]},
{title:"🧙 Build Your Homework Escape Plan",desc:"Create a routine that works for your actual school week.",pick:[["Where is your best homework starting spot?","Desk","Kitchen table","School library","Another quiet place"],["What will you do when you miss your planned start?","Restart with a five-minute attempt","Give up for the day","Stay up all night"]],write:[["What exact assignment will you start?","Course, task and first action."],["When and where will you start?","Choose a realistic school day, time and place."],["How will you keep Roblox or YouTube from interrupting?","Choose a strategy you are willing to use."],["What is your backup plan if you get stuck?","Explain what you will do rather than abandoning the task."]]},
{title:"🏆 Unlock Next Week",desc:"Reflect on what you learned and choose a manageable challenge.",pick:[["How confident are you about the five-minute rule?","Very confident","Somewhat confident","Not confident yet"],["How many school days will you practise?","One","Two","Three"]],write:[["What is the most useful strategy you learned today?","Explain why it might work for you."],["Write your challenge for next week.","Include what you will start, when, and how you will measure success."],["What should Laura ask you about next session?","Choose a question that would help you reflect honestly."]]}
,{"title":"🎃 BONUS: Halloween Trivia Vault","desc":"Optional fun round if you have time. Choose an answer, see feedback and try to unlock the trivia trophy!","trivia":[["Which vegetable was traditionally carved into lanterns in parts of Ireland and Scotland before pumpkins became popular?","Turnips","Carrots","Cucumbers",0,"Turnips were used for early jack-o'-lanterns."],["What does 'nocturnal' mean?","Active mainly at night","Active mainly at noon","Able to fly",0,"Nocturnal animals are active mostly at night."],["Which planet has the shortest day?","Earth","Jupiter","Mars",1,"Jupiter rotates in about 10 hours."],["Which author wrote Frankenstein?","Mary Shelley","Bram Stoker","Edgar Allan Poe",0,"Mary Shelley published Frankenstein in 1818."],["If 12 houses each give 3 candies, how many candies is that?","24","36","48",1,"12 × 3 = 36."],["Which animal uses echolocation to navigate in darkness?","Bat","Rabbit","Turtle",0,"Many bats use echoes to locate objects and prey."]],"write":[["Which trivia question surprised you?","Tell Laura something new you learned."]]}];let current=0;const state={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function set(k,v){state[k]=v}function render(){const m=missions[current];document.getElementById('progress').value=current+1;document.getElementById('counter').textContent=(m.trivia?'Bonus round':'Mission '+(current+1)+' of '+(missions.length-1));document.getElementById('heading').textContent=m.title;document.getElementById('description').textContent=m.desc;const root=document.getElementById('activity');root.innerHTML='';if(m.courses){m.courses.forEach((course,i)=>{const wrap=document.createElement('div');wrap.className='task';const h=document.createElement('h3');h.textContent=['🔬','📖','🎬','⚗️'][i]+' '+course;wrap.append(h);const fields=[['Current mark or standing','Mark, level or not sure'],['Most recent completed or submitted work','Name one assignment, lab or task'],['Next assignment, test or deadline','Include the date, or say what you need to check'],['What is going well?','A skill, grade or accomplishment'],['What needs attention or follow-up?','A question, missing task, study plan or teacher check-in']];fields.forEach(([label,placeholder],j)=>{const key=current+'-course-'+i+'-'+j;const lab=document.createElement('label');lab.textContent=label;const input=document.createElement('textarea');input.rows=2;input.style.minHeight='65px';input.placeholder=placeholder;input.value=state[key]||'';input.oninput=()=>set(key,input.value);wrap.append(lab,input)});root.append(wrap)})}if(m.trivia){m.trivia.forEach((q,i)=>{const key=current+'-trivia-'+i;const wrap=document.createElement('div');wrap.className='task';const h=document.createElement('h3');h.textContent=(i+1)+'. '+q[0];wrap.append(h);q.slice(1,4).forEach((answer,j)=>{const b=document.createElement('button');b.className='choice'+(state[key]===j?' selected':'');b.textContent=answer;b.onclick=()=>{set(key,j);render()};wrap.append(b)});if(state[key]!==undefined){const p=document.createElement('p');p.className='feedback';p.textContent=(state[key]===q[4]?'✓ Correct! ':'Not quite. ')+q[5];wrap.append(p)}root.append(wrap)});const score=m.trivia.filter((q,i)=>state[current+'-trivia-'+i]===q[4]).length;const scoreEl=document.createElement('p');scoreEl.className='note';scoreEl.textContent='🎃 Trivia score: '+score+' / '+m.trivia.length;root.append(scoreEl)}if(m.pick)m.pick.forEach((q,i)=>{const key=current+'-pick-'+i;const wrap=document.createElement('div');wrap.className='task';wrap.innerHTML='<h3>'+esc(q[0])+'</h3>';q.slice(1).forEach((v,j)=>{const b=document.createElement('button');b.className='choice'+(state[key]===v?' selected':'');b.textContent=v;b.onclick=()=>{set(key,v);render()};wrap.append(b)});root.append(wrap)});if(m.sort){const key=current+'-sort';if(!state[key])state[key]=[...m.sort.items].reverse();const wrap=document.createElement('div');wrap.className='task';wrap.innerHTML='<h3>🧩 Drag to reorder, or use ↑ and ↓</h3><p class="muted">Place the steps in the order you would complete them. Explain your reasoning afterwards.</p>';const ul=document.createElement('ul');ul.className='sortable';let from=null;state[key].forEach((v,i)=>{const li=document.createElement('li');li.draggable=true;li.innerHTML='<span>'+esc(v)+'</span>';const up=document.createElement('button'),down=document.createElement('button');up.className=down.className='sortbtn';up.textContent='↑';down.textContent='↓';up.setAttribute('aria-label','Move up');down.setAttribute('aria-label','Move down');up.disabled=i===0;down.disabled=i===state[key].length-1;function move(j){const a=state[key];[a[i],a[j]]=[a[j],a[i]];render()}up.onclick=()=>move(i-1);down.onclick=()=>move(i+1);li.append(up,down);li.ondragstart=()=>{from=i;li.classList.add('dragging')};li.ondragover=e=>e.preventDefault();li.ondrop=e=>{e.preventDefault();if(from===null||from===i)return;const a=state[key];a.splice(i,0,a.splice(from,1)[0]);render()};ul.append(li)});wrap.append(ul);root.append(wrap)}if(m.bucket){const key=current+'-bucket';if(!state[key])state[key]={};const wrap=document.createElement('div');wrap.className='task';wrap.innerHTML='<h3>🗂️ Sort by priority</h3><p>Select a category for each task, or drag a task into a category.</p>';const pool=document.createElement('div');const grid=document.createElement('div');grid.className='grid';let dragging=null;const tasks=m.bucket.items;function tag(task){const el=document.createElement('div');el.className='tag';el.draggable=true;el.textContent=task;el.ondragstart=()=>dragging=task;const sel=document.createElement('select');sel.setAttribute('aria-label','Priority for '+task);['Not sorted',...m.bucket.groups].forEach(g=>{const op=document.createElement('option');op.textContent=g;op.value=g==='Not sorted'?'':g;sel.append(op)});sel.value=state[key][task]||'';sel.onchange=()=>{state[key][task]=sel.value;render()};el.append(sel);return el}tasks.filter(t=>!state[key][t]).forEach(t=>pool.append(tag(t)));wrap.append(pool);m.bucket.groups.forEach(g=>{const box=document.createElement('div');box.className='bucket';const h=document.createElement('h3');h.textContent=g;box.append(h);tasks.filter(t=>state[key][t]===g).forEach(t=>box.append(tag(t)));box.ondragover=e=>e.preventDefault();box.ondrop=e=>{e.preventDefault();if(dragging){state[key][dragging]=g;render()}};grid.append(box)});wrap.append(grid);root.append(wrap)}m.write.forEach((q,i)=>{const key=current+'-write-'+i;const div=document.createElement('div');div.className='task';const label=document.createElement('label');label.textContent=q[0];const ta=document.createElement('textarea');ta.placeholder=q[1];ta.value=state[key]||'';ta.oninput=()=>set(key,ta.value);div.append(label,ta);root.append(div)});if(current===missions.length-1){const b=document.createElement('button');b.className='download';b.textContent='⬇ Download my practice responses';b.onclick=()=>{const lines=missions.map((m,i)=>{let out=[m.title];if(m.courses)m.courses.forEach((course,c)=>{out.push(course);['Current mark','Completed work','Upcoming deadline','Success','Follow-up'].forEach((field,j)=>out.push(field+': '+(state[i+'-course-'+c+'-'+j]||'')))});if(m.trivia)m.trivia.forEach((q,j)=>out.push(q[0]+': '+(state[i+'-trivia-'+j]===undefined?'':q[1+state[i+'-trivia-'+j]])));if(m.pick)m.pick.forEach((q,j)=>out.push(q[0]+': '+(state[i+'-pick-'+j]||'')));if(m.sort)out.push('Sequence: '+(state[i+'-sort']||[]).join(' → '));if(m.bucket)out.push('Priorities: '+JSON.stringify(state[i+'-bucket']||{}));m.write.forEach((q,j)=>out.push(q[0]+'\n'+(state[i+'-write-'+j]||'')));return out.join('\n')}).join('\n\n');const blob=new Blob([lines],{type:'text/plain'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='daniel-halloween-practice.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};root.append(b)}document.getElementById('back').disabled=current===0;document.getElementById('next').textContent=current===missions.length-1?'Review from beginning ↺':'Next mission →'}document.getElementById('back').onclick=()=>{if(current>0){current--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{current=current===missions.length-1?0:current+1;render();scrollTo(0,0)};render();
</script></body></html>
