<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laura | Daniel Priority Planner Dashboard</title><style>*{box-sizing:border-box}body{font:17px system-ui;margin:0;background:#f3effb;color:#2b2146}header{background:#302057;color:white;padding:25px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:17px;padding:24px;margin:16px 0;box-shadow:0 4px 15px #22113b12}button,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #c8b9df}button{background:#6443aa;color:white;cursor:pointer;margin:4px}textarea{display:block;width:100%;min-height:85px;margin:8px 0 20px}label{font-weight:650;display:block;margin-top:18px}h1{margin:0 0 8px}h2{margin:0 0 10px}.muted{color:#665c77}.q{background:#f8f5ff;border-radius:12px;padding:14px;margin:12px 0}select{font:inherit;padding:9px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quadrant{padding:15px;border-radius:12px;background:#f6f0ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header><h1>🌈 Laura's Live Dashboard</h1>Daniel · Priority Planner · 90 minutes</header><main><section class="card" id="gate"><button id="login">Sign in with Google</button><p id="status"></p></section><div id="work" hidden><section class="card"><h2>Live response status</h2><p id="sync"></p><button id="download">Download all answers (CSV)</button></section><section class="card"><h2>All missions and questions</h2><p>Past, current and future questions are always visible. Answers update automatically as Daniel types.</p><div id="all"></div></section></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyC7y-jx-LMOJyjtbLHuChc3yEGZXlQrtZ8',authDomain:'live-learning-with-laura.firebaseapp.com',projectId:'live-learning-with-laura',appId:'1:846701984036:web:0447c64aef753c1c1e1bb1'});const auth=getAuth(app),db=getFirestore(app);const ref=doc(db,'studentAnswers','daniel__daniel_halloween_20261028');const $=id=>document.getElementById(id);const missions=[["Course check-in: Physics",["Current mark or level, and how confident are you in this course?","What was the last assignment, quiz or lab you submitted?","What is coming up next? Include the due date and estimated time needed.","What is going well in Physics?","What is confusing or unfinished?","What is your next concrete action for Physics?"]],["Course check-in: English",["Current mark or level, and how confident are you in this course?","What was the last assignment or presentation you submitted?","What is coming up next? Include the due date and estimated time needed.","What is going well in English?","What is difficult or unfinished?","What is your next concrete action for English?"]],["Course check-in: Communications Technology",["Current mark or level, and how confident are you in this course?","What project or task did you most recently finish?","What is coming up next? Include the due date and estimated time needed.","What is going well?","What is unfinished or holding you back?","What is your next concrete action?"]],["Course check-in: Chemistry",["Current mark or level, and how confident are you in this course?","What was the last lab, assignment or test you completed?","What is coming up next? Include the due date and estimated time needed.","What is going well in Chemistry?","What topic or task needs support?","What is your next concrete action for Chemistry?"]],["Build your assignment inventory",["List every assignment, test, project and missing task across your four classes.","Which deadlines are confirmed? Which ones must you check in Google Classroom?","Which assignment is worth the most marks or has the biggest consequences?","Which task have you been avoiding, and why?"]],["Urgent versus important",["In your own words, what makes a task urgent?","In your own words, what makes a task important?","Give one school example that is urgent but not very important.","Give one school example that is important but not urgent.","Why can a task become urgent when you put it off?"]],["Matrix quadrant 1: Do now",["A Chemistry test is tomorrow and you have not reviewed. Which quadrant and why?","A major English assignment is due tonight. What are the first three steps?","Choose one real task you need to do soon. Write the first five-minute action."]],["Matrix quadrant 2: Schedule",["A Physics project is due in two weeks. Why is planning now useful?","Write three small steps you could schedule for a long-term project.","What time tomorrow could you spend 15 minutes on an important but non-urgent task?"]],["Matrix quadrant 3: Delegate or seek help",["A group member asks you to do their part of a project today. How should you respond?","What school tasks can you ask for help with, without giving away responsibility for your own learning?","Write a respectful message asking a teacher to clarify a deadline."]],["Matrix quadrant 4: Eliminate or limit",["What activities pull you away from schoolwork when you get home?","How could you limit Roblox or YouTube without banning them completely?","What is a realistic boundary you could test for one school week?"]],["Sorting challenge: Real-life decisions",["Sort: Finish an assignment due tomorrow. Explain your choice.","Sort: Review vocabulary for a test next month. Explain your choice.","Sort: Respond immediately to a non-essential gaming message. Explain your choice.","Sort: Ask a teacher for help with an assignment you do not understand. Explain your choice.","Sort: Plan a study schedule before a busy week. Explain your choice."]],["When everything feels urgent",["You have three assignments due within 48 hours. What information do you need before deciding?","How would you compare due dates, marks, difficulty and time required?","What would you do if you cannot finish everything?","What would you say to a teacher if you need clarification or support?"]],["Break it into five-minute starts",["Pick your most avoided assignment. What is the smallest possible starting step?","What materials or tabs do you need open before starting?","What might distract you in the first five minutes?","If you finish the first five minutes, what could you do next?"]],["Estimate and schedule",["Choose two tasks and estimate minutes for each.","Break one large task into three timed work blocks.","When will you do each block? Include the day and approximate time.","What is your backup plan if the first work block takes longer?"]],["Your personal priority matrix",["DO NOW: Enter a real urgent and important task.","SCHEDULE: Enter a real important but not urgent task.","SEEK HELP / DELEGATE: Enter a task or request that can be shared or clarified.","LIMIT / ELIMINATE: Enter a low-value distraction you can reduce.","Which quadrant do you spend too much time in? What change would help?"]],["A realistic after-school routine",["Describe what you normally do in the first 30 minutes after school.","Where would a five-minute homework start fit?","What would help you switch from gaming to homework?","What reward or break would be reasonable after one work block?"]],["Reflection and decision-making",["Which quadrant was easiest to understand? Why?","Which quadrant was hardest to apply to your own work?","What did you discover about your assignment workload?","What one strategy will you use tomorrow?"]],["Weekly commitment and check-out",["Name one assignment you will begin before gaming.","When and where will you start it?","What will you do for the first five minutes?","How will you know whether the strategy worked?","What will you report to Laura at the next session?"]]];const key='nov90-';let answers={},page=0;const teacher='laurademe6@gmail.com';$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('status').textContent=e.message);onAuthStateChanged(auth,u=>{if(!u||u.email!==teacher||!u.emailVerified){$('status').textContent='Teacher Google sign-in required';return}$('gate').hidden=true;$('work').hidden=false;onSnapshot(ref,s=>{const d=s.data()||{};answers=d.answers||{};page=d.page||0;$('sync').textContent='Live · Daniel is on mission '+(page+1)+' · '+Object.keys(answers).filter(k=>k.startsWith(key)).length+' responses in this lesson';render()},e=>$('sync').textContent='Connection error: '+e.message)});function render(){const root=$('all');root.replaceChildren();missions.forEach((m,i)=>{const box=document.createElement('section');box.className='card';const h=document.createElement('h2');h.textContent=(i+1)+'. '+m[0]+(i===page?' · CURRENT':'');box.append(h);if(i>=5&&i<=15){const q=document.createElement('div');q.innerHTML="<div class=\"grid\"><div class=\"quadrant\"><b>1 · DO NOW</b><p>Urgent + important. Deadlines, serious consequences.</p></div><div class=\"quadrant\"><b>2 · SCHEDULE</b><p>Important, not urgent. Planning, studying, long-term projects.</p></div><div class=\"quadrant\"><b>3 · SEEK HELP / DELEGATE</b><p>Urgent, less important to your goals. Share appropriate tasks or clarify requests; you remain responsible for your own learning.</p></div><div class=\"quadrant\"><b>4 · LIMIT / ELIMINATE</b><p>Neither urgent nor important. Reduce distractions when schoolwork needs attention.</p></div></div>";box.append(q)}m[1].forEach((question,j)=>{const row=document.createElement('div');row.className='q';const b=document.createElement('strong');b.textContent=(j+1)+'. '+question;const p=document.createElement('p');p.textContent=answers[key+i+'-'+j]||'Not answered yet';row.append(b,p);box.append(row)});root.append(box)})}function csvCell(s){return '"'+String(s).replaceAll('"','""')+'"'}$('download').onclick=()=>{const lines=[['Mission','Question','Response'].map(csvCell).join(',')];missions.forEach((m,i)=>m[1].forEach((q,j)=>lines.push([m[0],q,answers[key+i+'-'+j]||''].map(csvCell).join(','))));const blob=new Blob([lines.join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Daniel-Priority-Planner-Responses.csv';a.click();URL.revokeObjectURL(a.href)};</script></html>
