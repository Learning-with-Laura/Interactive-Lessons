<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laura | Daniel Priority Planner Dashboard</title><style>*{box-sizing:border-box}body{font:17px system-ui;margin:0;background:#f3effb;color:#2b2146}header{background:#302057;color:white;padding:25px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:17px;padding:24px;margin:16px 0;box-shadow:0 4px 15px #22113b12}button,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #c8b9df}button{background:#6443aa;color:white;cursor:pointer;margin:4px}textarea{display:block;width:100%;min-height:85px;margin:8px 0 20px}label{font-weight:650;display:block;margin-top:18px}h1{margin:0 0 8px}h2{margin:0 0 10px}.muted{color:#665c77}.q{background:#f8f5ff;border-radius:12px;padding:14px;margin:12px 0}select{font:inherit;padding:9px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quadrant{padding:15px;border-radius:12px;background:#f6f0ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header><h1>🌈 Laura's Live Dashboard</h1>Daniel · Priority Planner · 60 minutes</header><main><section class="card" id="gate"><button id="login">Sign in with Google</button><p id="status"></p></section><div id="work" hidden><section class="card"><h2>Live response status</h2><p id="sync"></p><button id="download">Download all answers (CSV)</button></section><section class="card"><h2>All missions and questions</h2><p>Past, current and future questions are always visible. Answers update automatically as Daniel types.</p><div id="all"></div></section></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyC7y-jx-LMOJyjtbLHuChc3yEGZXlQrtZ8',authDomain:'live-learning-with-laura.firebaseapp.com',projectId:'live-learning-with-laura',appId:'1:846701984036:web:0447c64aef753c1c1e1bb1'});const auth=getAuth(app),db=getFirestore(app);const ref=doc(db,'studentAnswers','daniel__daniel_halloween_20261028');const $=id=>document.getElementById(id);const missions=[["New weekly course update · start fresh",["PHYSICS: What did you complete this week, and what is your next assignment or test (with due date)?","PHYSICS: What is your current priority or question for Laura?","ENGLISH: What did you complete this week, and what is your next assignment or test (with due date)?","ENGLISH: What is your current priority or question for Laura?","COMMUNICATIONS TECHNOLOGY: What did you complete this week, and what is your next project or deadline?","COMMUNICATIONS TECHNOLOGY: What is your current priority or question for Laura?","CHEMISTRY: What did you complete this week, and what is your next lab, assignment or test (with due date)?","CHEMISTRY: What is your current priority or question for Laura?"]],["Understand the Eisenhower Matrix · 5 minutes",["What is the difference between URGENT (needs attention soon) and IMPORTANT (matters to your goals or consequences)?","A major project is due in two weeks. Is it important, urgent, both or neither? Why?","A worksheet worth marks is due tomorrow. Is it urgent, important, both or neither? Why?"]],["Sort real situations · 6 minutes",["A Chemistry test is tomorrow and you have not studied. Which quadrant: DO NOW, SCHEDULE, SEEK HELP, or LIMIT? Explain.","You want to prepare a strong Shad 2027 application well before January. Which quadrant does it belong in today? Why?","A friend sends a gaming invitation while you are beginning homework. Which quadrant does answering immediately belong in?","A group project partner needs clarification on who is responsible for one task. Which quadrant best fits getting clarification? Why?"]],["Build your own priority matrix · 7 minutes",["DO NOW: Which real school task is both urgent and important? Include its deadline.","SCHEDULE: Which important task can you plan before it becomes urgent? Include a date and time.","SEEK HELP: What can you clarify with a teacher or project partner?","LIMIT: Which distraction could you reduce during your homework block?"]],["Turn a priority into action · 4 minutes",["Choose one DO NOW or SCHEDULE task. What is the very first five-minute step?","When will you start, and what will you do if you feel like opening Roblox or YouTube instead?"]],["Matrix practice: what changes urgency? · 7 minutes",["An English presentation is due in ten days. What would you schedule today to keep it in Quadrant 2?","The same presentation is due tomorrow and nothing is started. What changed, and which quadrant is it now?","What early warning signs tell you an important task is becoming urgent?","How can checking Google Classroom twice a week help prevent deadline surprises?"]],["Priority decisions under pressure · 7 minutes",["You have a Physics quiz tomorrow, a Chemistry lab due Friday and a Communications Technology project due next week. In what order would you tackle them, and why?","A classmate asks you to help edit their video tonight while you have your own deadline. How would you respond?","You feel overwhelmed by three tasks. What could you do in the next five minutes instead of avoiding all three?"]],["Plan the Shad application · 7 minutes",["What did you learn from the November 5 Shad information session, or what do you hope to learn if you have not attended yet?","What application information, examples or references will you need to gather?","Which Shad preparation tasks belong in Quadrant 2 now?","Choose a realistic day and time to work on one Shad application step."]],["Make a weekly action plan · 9 minutes",["Choose your top three priorities for the next seven days, with due dates.","Which priority belongs in DO NOW and which in SCHEDULE? Explain.","Plan two short homework blocks, including when, where and what you will do.","What might interrupt your plan? Write one if-then response.","What evidence of progress will you show Laura next week?"]],["Exit ticket · 3 minutes",["Explain in one sentence why IMPORTANT does not always mean URGENT.","What one task will you complete or start before our next session?"]]];const key='weekly-20261111-';let answers={},page=0;const teacher='laurademe6@gmail.com';$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('status').textContent=e.message);onAuthStateChanged(auth,u=>{if(!u||u.email!==teacher||!u.emailVerified){$('status').textContent='Teacher Google sign-in required';return}$('gate').hidden=true;$('work').hidden=false;onSnapshot(ref,s=>{const d=s.data()||{};answers=d.answers||{};page=d.page||0;$('sync').textContent='Live · Daniel is on mission '+(page+1)+' · '+Object.keys(answers).filter(k=>k.startsWith(key)).length+' responses in this lesson';render()},e=>$('sync').textContent='Connection error: '+e.message)});function render(){const root=$('all');root.replaceChildren();missions.forEach((m,i)=>{const box=document.createElement('section');box.className='card';const h=document.createElement('h2');h.textContent=(i+1)+'. '+m[0]+(i===page?' · CURRENT':'');box.append(h);if(i>=5&&i<=15){const q=document.createElement('div');q.innerHTML="<div class=\"grid\"><div class=\"quadrant\"><b>1 · DO NOW</b><p>Urgent + important. Deadlines, serious consequences.</p></div><div class=\"quadrant\"><b>2 · SCHEDULE</b><p>Important, not urgent. Planning, studying, long-term projects.</p></div><div class=\"quadrant\"><b>3 · SEEK HELP / DELEGATE</b><p>Urgent, less important to your goals. Share appropriate tasks or clarify requests; you remain responsible for your own learning.</p></div><div class=\"quadrant\"><b>4 · LIMIT / ELIMINATE</b><p>Neither urgent nor important. Reduce distractions when schoolwork needs attention.</p></div></div>";box.append(q)}m[1].forEach((question,j)=>{const row=document.createElement('div');row.className='q';const b=document.createElement('strong');b.textContent=(j+1)+'. '+question;const p=document.createElement('p');p.textContent=answers[key+i+'-'+j]||'Not answered yet';row.append(b,p);box.append(row)});root.append(box)})}function csvCell(s){return '"'+String(s).replaceAll('"','""')+'"'}$('download').onclick=()=>{const lines=[['Mission','Question','Response'].map(csvCell).join(',')];missions.forEach((m,i)=>m[1].forEach((q,j)=>lines.push([m[0],q,answers[key+i+'-'+j]||''].map(csvCell).join(','))));const blob=new Blob([lines.join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Daniel-Priority-Planner-Responses.csv';a.click();URL.revokeObjectURL(a.href)};</script></html>
