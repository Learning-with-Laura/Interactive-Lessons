<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daniel | Priorities and Homework Planner</title><style>*{box-sizing:border-box}body{font:17px system-ui;margin:0;background:#f3effb;color:#2b2146}header{background:#302057;color:white;padding:25px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:17px;padding:24px;margin:16px 0;box-shadow:0 4px 15px #22113b12}button,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #c8b9df}button{background:#6443aa;color:white;cursor:pointer;margin:4px}textarea{display:block;width:100%;min-height:85px;margin:8px 0 20px}label{font-weight:650;display:block;margin-top:18px}h1{margin:0 0 8px}h2{margin:0 0 10px}.muted{color:#665c77}.q{background:#f8f5ff;border-radius:12px;padding:14px;margin:12px 0}select{font:inherit;padding:9px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quadrant{padding:15px;border-radius:12px;background:#f6f0ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header><h1>📚 Daniel's Priority Planner</h1>Learning with Laura · Grade 11 · 30-minute executive functioning lesson</header><main><section class="card" id="gate"><h2>🔐 Sign in</h2><p>Use your Learning with Laura password.</p><form id="login"><input type="password" id="pw" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form><p id="status"></p></section><div id="work" hidden><section class="card"><p id="sync"></p><button id="prev">← Previous mission</button><select id="mission"></select><button id="next">Next mission →</button><button id="export">Save a copy of answers</button><p id="progress"></p></section><section class="card" id="activity"></section></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyC7y-jx-LMOJyjtbLHuChc3yEGZXlQrtZ8',authDomain:'live-learning-with-laura.firebaseapp.com',projectId:'live-learning-with-laura',appId:'1:846701984036:web:0447c64aef753c1c1e1bb1'});const auth=getAuth(app),db=getFirestore(app);const ref=doc(db,'studentAnswers','daniel__daniel_halloween_20261028');const $=id=>document.getElementById(id);const missions=[["Quick school check-in · 5 minutes",["PHYSICS: What assignment, test or project is next, and when is it due?","PHYSICS: What is your next action?","ENGLISH: What assignment, test or project is next, and when is it due?","ENGLISH: What is your next action?","COMMUNICATIONS TECHNOLOGY: What assignment or project is next, and when is it due?","COMMUNICATIONS TECHNOLOGY: What is your next action?","CHEMISTRY: What assignment, lab or test is next, and when is it due?","CHEMISTRY: What is your next action?"]],["Understand the Eisenhower Matrix · 5 minutes",["What is the difference between URGENT (needs attention soon) and IMPORTANT (matters to your goals or consequences)?","A major project is due in two weeks. Is it important, urgent, both or neither? Why?","A worksheet worth marks is due tomorrow. Is it urgent, important, both or neither? Why?"]],["Sort real situations · 6 minutes",["A Chemistry test is tomorrow and you have not studied. Which quadrant: DO NOW, SCHEDULE, SEEK HELP, or LIMIT? Explain.","You want to prepare a strong Shad 2027 application well before January. Which quadrant does it belong in today? Why?","A friend sends a gaming invitation while you are beginning homework. Which quadrant does answering immediately belong in?","A group project partner needs clarification on who is responsible for one task. Which quadrant best fits getting clarification? Why?"]],["Build your own priority matrix · 7 minutes",["DO NOW: Which real school task is both urgent and important? Include its deadline.","SCHEDULE: Which important task can you plan before it becomes urgent? Include a date and time.","SEEK HELP: What can you clarify with a teacher or project partner?","LIMIT: Which distraction could you reduce during your homework block?"]],["Turn a priority into action · 4 minutes",["Choose one DO NOW or SCHEDULE task. What is the very first five-minute step?","When will you start, and what will you do if you feel like opening Roblox or YouTube instead?"]],["Exit ticket · 3 minutes",["Explain in one sentence why IMPORTANT does not always mean URGENT.","What one task will you complete or start before our next session?"]]];const key='nov30-';let page=0,answers={},ready=false,saveTimer;const mail='daniel.song@learning-with-laura.github.io';$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,mail,$('pw').value);$('pw').value=''}catch(err){$('status').textContent='Sign-in failed: '+err.code}};onAuthStateChanged(auth,u=>{if(!u||u.email!==mail){$('status').textContent='Enter your password to start.';return}$('gate').hidden=true;$('work').hidden=false;onSnapshot(ref,s=>{if(!ready){const d=s.data()||{};answers=d.answers||{};page=Math.min(5,Math.max(0,d.page||0));ready=true;render()}$('sync').textContent='✓ Connected to Laura’s live dashboard'},e=>$('sync').textContent='⚠ '+e.message)});missions.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+m[0];$('mission').append(o)});function save(){if(!ready)return;clearTimeout(saveTimer);$('sync').textContent='Saving…';saveTimer=setTimeout(async()=>{try{await setDoc(ref,{answers,page,updatedAt:serverTimestamp()});$('sync').textContent='✓ Saved live for Laura'}catch(e){$('sync').textContent='⚠ Save failed: '+e.message}},450)}function render(){const m=missions[page];$('mission').value=page;$('progress').textContent='Mission '+(page+1)+' of '+missions.length+' · Suggested time: 3–7 minutes per mission';const root=$('activity');root.replaceChildren();const h=document.createElement('h2');h.textContent=m[0];root.append(h);if(page>=1&&page<=4){const box=document.createElement('div');box.innerHTML="<div class=\"grid\"><div class=\"quadrant\"><b>1 · DO NOW</b><p>Urgent + important. Deadlines, serious consequences.</p></div><div class=\"quadrant\"><b>2 · SCHEDULE</b><p>Important, not urgent. Planning, studying, long-term projects.</p></div><div class=\"quadrant\"><b>3 · SEEK HELP / DELEGATE</b><p>Urgent, less important to your goals. Share appropriate tasks or clarify requests; you remain responsible for your own learning.</p></div><div class=\"quadrant\"><b>4 · LIMIT / ELIMINATE</b><p>Neither urgent nor important. Reduce distractions when schoolwork needs attention.</p></div></div>";root.append(box)}m[1].forEach((q,j)=>{const wrap=document.createElement('div');wrap.className='q';const lab=document.createElement('label');lab.textContent=(j+1)+'. '+q;const ta=document.createElement('textarea');const k=key+page+'-'+j;ta.value=answers[k]||'';ta.placeholder='Write your answer here…';ta.addEventListener('input',()=>{answers[k]=ta.value;save()});wrap.append(lab,ta);root.append(wrap)})}function go(n){page=Math.max(0,Math.min(missions.length-1,n));render();save();window.scrollTo(0,0)}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('mission').onchange=e=>go(Number(e.target.value));$('export').onclick=()=>{const blob=new Blob([Object.entries(answers).map(([k,v])=>k+'\t'+v.replaceAll('\n',' ')).join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Daniel-Priority-Planner-Answers.txt';a.click();URL.revokeObjectURL(a.href)};</script></html>
