<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daniel | Priorities and Homework Planner</title><style>*{box-sizing:border-box}body{font:17px system-ui;margin:0;background:#f3effb;color:#2b2146}header{background:#302057;color:white;padding:25px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:17px;padding:24px;margin:16px 0;box-shadow:0 4px 15px #22113b12}button,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #c8b9df}button{background:#6443aa;color:white;cursor:pointer;margin:4px}textarea{display:block;width:100%;min-height:85px;margin:8px 0 20px}label{font-weight:650;display:block;margin-top:18px}h1{margin:0 0 8px}h2{margin:0 0 10px}.muted{color:#665c77}.q{background:#f8f5ff;border-radius:12px;padding:14px;margin:12px 0}select{font:inherit;padding:9px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quadrant{padding:15px;border-radius:12px;background:#f6f0ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header><h1>📚 Daniel's Priority Planner</h1>Learning with Laura · Grade 11 · Eisenhower Matrix + conversation skills</header><main><section class="card" id="gate"><h2>🔐 Choose your dashboard</h2><p><strong>Daniel:</strong> Enter your Learning with Laura password below.</p><p><a href="teacher.html" style="display:inline-block;padding:14px 18px;border-radius:10px;background:#e7dcfa;color:#302057;font-weight:700;text-decoration:none">👩‍🏫 Laura: Teacher Dashboard (Google sign-in)</a></p><form id="login"><input type="password" id="pw" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form><p id="status"></p></section><div id="work" hidden><section class="card"><p id="sync"></p><button id="prev">← Previous mission</button><select id="mission"></select><button id="next">Next mission →</button><button id="export">Save a copy of a ive listening · reflect before replying",["Listen while Laura shares a short story. Reflect back the main point using 'So you're saying…' or 'It sounds like…'.","Ask one follow-up question about what Laura said, without switching immediately to your own experience.","What did you learn by listening instead of planning what to say next?"]],["Laura's live observation · teacher feedback",["LAURA: Did Daniel make one clear point without overexplaining? Record an example.","LAURA: Did Daniel pause and allow silence without filling it? Independent, prompted or not yet?","LAURA: Did Daniel invite the other person to contribute? Record his words.","LAURA: Did Daniel listen and reflect back what was said? Independent, prompted or not yet?","LAURA: Did Daniel notice whether the listener wanted to continue, contribute, change topics or leave?","LAURA: What is one strength and one next step for Daniel?"]],["Conversation challenge · next week",["Daniel: In three real conversations this week, try make a point, pause, invite. Who could you practise with?","How will you know you gave the other person a chance to contribute?","What will you tell Laura next week about how the conversations went?"]]];const key='weekly-20261111-';let page=0,answers={},ready=false,saveTimer;const mail='daniel.song@learning-with-laura.github.io';$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,mail,$('pw').value);$('pw').value=''}catch(err){$('status').textContent='Sign-in failed: '+err.code}};onAuthStateChanged(auth,u=>{if(!u||u.email!==mail){$('status').textContent='Enter your password to start.';return}$('gate').hidden=true;$('work').hidden=false;onSnapshot(ref,s=>{if(!ready){const d=s.data()||{};answers=d.answers||{};page=Object.keys(answers).some(k=>k.startsWith(key))?Math.min(missions.length-1,Math.max(0,d.page||0)):0;ready=true;render()}$('sync').textContent='✓ Connected to Laura’s live dashboard'},e=>$('sync').textContent='⚠ '+e.message)});missions.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+m[0];$('mission').append(o)});function save(){if(!ready)return;clearTimeout(saveTimer);$('sync').textContent='Saving…';saveTimer=setTimeout(async()=>{try{await setDoc(ref,{answers,page,updatedAt:serverTimestamp()},{merge:true});$('sync').textContent='✓ Saved live for Laura'}catch(e){$('sync').textContent='⚠ Save failed: '+e.message}},450)}function render(){const m=missions[page];$('mission').value=page;$('progress').textContent='Mission '+(page+1)+' of '+missions.length+' · Practice aloud with Laura; type brief reflections and feedback';const root=$('activity');root.replaceChildren();const h=document.createElement('h2');h.textContent=m[0];root.append(h);if(page>=1&&page<=8){const box=document.createElement('div');box.innerHTML="<div class=\"grid\"><div class=\"quadrant\"><b>1 · DO NOW</b><p>Urgent + important. Deadlines, serious consequences.</p></div><div class=\"quadrant\"><b>2 · SCHEDULE</b><p>Important, not urgent. Planning, studying, long-term projects.</p></div><div class=\"quadrant\"><b>3 · SEEK HELP / DELEGATE</b><p>Urgent, less important to your goals. Share appropriate tasks or clarify requests; you remain responsible for your own learning.</p></div><div class=\"quadrant\"><b>4 · LIMIT / ELIMINATE</b><p>Neither urgent nor important. Reduce distractions when schoolwork needs attention.</p></div></div>";root.append(box)}m[1].forEach((q,j)=>{const wrap=document.createElement('div');wrap.className='q';const lab=document.createElement('label');lab.textContent=(j+1)+'. '+q;const ta=document.createElement('textarea');const k=(page>=10?'conversation-20261118-':key)+page+'-'+j;ta.value=answers[k]||'';ta.placeholder='Write your answer here…';ta.addEventListener('input',()=>{answers[k]=ta.value;save()});wrap.append(lab,ta);root.append(wrap)})}function go(n){page=Math.max(0,Math.min(missions.length-1,n));render();save();window.scrollTo(0,0)}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('mission').onchange=e=>go(Number(e.target.value));$('export').onclick=()=>{const blob=new Blob([Object.entries(answers).map(([k,v])=>k+'\t'+v.replaceAll('\n',' ')).join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Daniel-Priority-Planner-Answers.txt';a.click();URL.revokeObjectURL(a.href)};</script></html>
