function showCheer(i){if(!teacher)Promise.resolve().then(()=>setDoc(answerDoc(),{cheerPosition:i},{merge:true})).catch(e=>msg("Celebration sync: "+e.message));const c=CHEERS[i%CHEERS.length];$("student").innerHTML="<div class='cheer-page'><div class='cheer-emoji' aria-hidden='true'>"+c[0]+"</div><h2>Mission "+(i+1)+" complete!</h2><p>"+safe(c[1])+"</p><p class='cheer-sub'>Take a spooky victory break. Your answers stay saved!</p><button id='cheerContinue'>🎃 Let's haunt the next mission!</button><button id='cheerBack'>← Back to Mission "+(i+1)+"</button></div>";$("cheerContinue").onclick=()=>{cheerFor=-1;move(nextMission(i))};$("cheerBack").onclick=()=>{cheerFor=-1;renderStudent()};}
function personalPanel(q,key){const g=q[2],source=responses[g[1]];const original=typeof source==="string"&&source.trim()?source.trim():"Your earlier response is not available yet. Return to the earlier mission to write it first.";let h="<div class='original-writing'><strong>From your earlier writing</strong><p>"+safe(original)+"</p></div><p class='notice'>"+safe(g[2])+"</p>";g[3].forEach((opt,k)=>h+="<button class='option "+(responses[key+"pick"]===k?"selected":"")+"' data-game-pick='"+k+"'>"+safe(opt)+"</button>");const chosen=responses[key+"pick"];if(chosen!==undefined){h+="<p class='game-feedback'>"+(chosen===g[4]?"✓ Correct. Now put that skill to work in YOUR writing.":"Not quite. Look for the option that makes the writing clearer and more accurate.")+"</p>";if(chosen===g[4])h+="<p><strong>"+safe(g[5])+"</strong></p><textarea data-game-rewrite='"+key+"' placeholder='Rewrite only the sentence you are improving.'>"+safe(responses[key]||"")+"</textarea>"}return h}
function renderStudent(mirror=false){if(!mirror&&cheerFor===position&&position!==15){showCheer(position);return;}const section=items[position];let h="<h2>"+safe(section[0])+"</h2><p class='notice'>🧠 Think carefully. Explain your reasoning. Check before moving on.</p>";section[2].forEach((q,j)=>{let key=qkey(position,j);h+="<div class='question'><h3>Mission "+(position+1)+", Question "+(j+1)+": "+safe(q[1])+"</h3>";if(q[0]==="match")h+="<p>Silhouette: "+safe(q[2][q[3]])+"</p>";if(q[0]==="reading")h+="<p>"+safe(q[2])+"</p>";if(q[0]==="match"){const answer=responses[key];h+="<p class='notice'>Drag a picture onto the black silhouette, or tap the matching picture.</p><div class='shadow-target' data-target='"+j+"' aria-label='Drop matching picture here'><span class='shadow-emoji'>"+safe(q[2][q[3]])+"</span><span class='match-feedback'>"+(answer===undefined?"Drop or tap your match":answer===q[3]?"✅ Correct match!":"Try another picture")+"</span></div><div class='match-choices'>";q[2].forEach((opt,k)=>h+="<button class='match-tile "+(answer===k?"selected":"")+"' draggable='true' data-match='"+j+"' data-value='"+k+"' aria-label='Match option "+(k+1)+"'>"+safe(opt)+"</button>");h+="</div>"}if(q[0]==="choice")q[2].forEach((opt,k)=>h+="<button class='option "+(responses[key]===k?"selected":"")+"' data-answer='"+j+"' data-value='"+k+"'>"+safe(opt)+"</button>");if(q[0]==="order"){let val=Array.isArray(responses[key])?responses[key]:q[2].slice().reverse();val.forEach((v,k)=>h+="<div class='row'><span>"+(k+1)+". "+safe(v)+"</span><button data-order='"+j+"' data-index='"+k+"' data-direction='-1' "+(k===0?"disabled":"")+">↑</button><button data-order='"+j+"' data-index='"+k+"' data-direction='1' "+(k===val.length-1?"disabled":"")+">↓</button></div>")}if(q[0]==="personal")h+=personalPanel(q,key);if(q[0]==="text")h+="<textarea data-text='"+j+"' placeholder='Type your answer here…'>"+safe(responses[key]||"")+"</textarea>";h+="</div>"});h+="<div class='row'><button id='prev' "+(position===0?"disabled":"")+">← Previous</button><button id='next' "+(position===15?"disabled":"")+">Next mission →</button></div>";(mirror?$("mirrorContent"):$("student")).innerHTML=h;if(mirror)return;$("prev").onclick=()=>move(previousMission(position));$("next").onclick=()=>{if(position===15)return;const current=position;try{cheerFor=current;showCheer(current)}catch(e){cheerFor=-1;msg("Moving to the next mission: "+e.message);move(nextMission(current))}};document.querySelectorAll("[data-game-pick]").forEach(b=>b.onclick=()=>{const key=qkey(position,0);saveAnswer(key+"pick",+b.dataset.gamePick).then(renderStudent)});document.querySelectorAll("[data-game-rewrite]").forEach(t=>{let timer;t.oninput=()=>{const key=t.dataset.gameRewrite,value=t.value;responses[key]=value;clearTimeout(timer);timer=setTimeout(()=>saveAnswer(key,value),350)}});document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>saveAnswer(qkey(position,+b.dataset.answer),+b.dataset.value).then(render));document.querySelectorAll("[data-match]").forEach(b=>{b.onclick=()=>{saveAnswer(qkey(position,+b.dataset.match),+b.dataset.value).then(renderStudent)};b.ondragstart=e=>e.dataTransfer.setData("text/plain",b.dataset.match+":"+b.dataset.value)});document.querySelectorAll("[data-target]").forEach(t=>{t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();const parts=(e.dataTransfer.getData("text/plain")||"").split(":");if(+parts[0]===+t.dataset.target&&parts.length===2)saveAnswer(qkey(position,+parts[0]),+parts[1]).then(renderStudent)}});document.querySelectorAll("[data-text]").forEach(t=>{let timer;t.oninput=()=>{const key=qkey(position,+t.dataset.text),value=t.value;responses[key]=value;clearTimeout(timer);timer=setTimeout(()=>saveAnswer(key,value),350)}});document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{let j=+b.dataset.order,key=qkey(position,j),q=items[position][2][j],v=Array.isArray(responses[key])?responses[key].slice():q[2].slice().reverse(),k=+b.dataset.index,n=k+(+b.dataset.direction);[v[k],v[n]]=[v[n],v[k]];saveAnswer(key,v).then(render)})}
function renderMirror(){const host=$("mirrorContent");if(!teacher||!host)return;if(cheerPosition===position&&position!==15){const c=CHEERS[position%CHEERS.length];host.innerHTML="<div class='cheer-page'><div class='cheer-emoji'>"+c[0]+"</div><h2>Mission "+(position+1)+" complete!</h2><p>"+safe(c[1])+"</p></div>";return}renderStudent(true);host.querySelectorAll("button,textarea,input").forEach(el=>{el.disabled=true})}
function downloadResponses(){const rows=[["Mission","Question number","Question type","Question","Answer choices","James's response","Status"]];items.forEach((section,i)=>section[2].forEach((q,j)=>{const key=qkey(i,j),answer=responses[key],has=answer!==undefined&&answer!==null&&answer!=="";const options=Array.isArray(q[2])?q[2].join(" | "):"";const displayed=!has?"":q[0]==="choice"?(q[2][answer]??String(answer)):Array.isArray(answer)?answer.join(" → "):String(answer);rows.push([section[0],j+1,q[0],q[1],options,displayed,has?"Answered":"Not answered"])}));const csv="\uFEFF"+rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="James-Phan-Halloween-Language-Responses-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);msg("Responses CSV downloaded.");}
function renderTeacher(){let h="<h2>James live screen</h2><p>Read-only view of James current mission and celebration screens.</p><div id=mirrorContent class=mirror-screen></div><hr><h2>📡 All missions and live responses</h2><p class='notice'>Questions and answer choices are always visible. Edit a field and select Save lesson to publish changes.</p><button id='saveLesson'>💾 Save lesson edits</button><button id='downloadResponses'>⬇ Download James responses (CSV)</button>";items.forEach((s,i)=>{h+="<details class='teacher' "+(i===position?"open":"")+"><summary><strong>Mission "+(i+1)+": "+safe(s[0])+"</strong> "+(i===position?"🟢 Current":"")+"</summary><label>Mission title<input data-title='"+i+"' value='"+safe(s[0])+"'></label>";s[2].forEach((q,j)=>{let key=qkey(i,j),answer=responses[key],display=answer===undefined?"⏳ Waiting for James":q[0]==="choice"?q[2][answer]??"Invalid selection":Array.isArray(answer)?answer.join(" → "):answer;h+="<div class='question'><strong>Mission "+(i+1)+", Question "+(j+1)+"</strong><p><small>"+safe(q[0])+"</small></p><label>Question<input data-question='"+i+":"+j+"' value='"+safe(q[1])+"'></label>";if(q[0]==="choice"||q[0]==="order"||q[0]==="match"){q[2].forEach((opt,k)=>h+="<label>Choice "+(k+1)+"<input data-option='"+i+":"+j+":"+k+"' value='"+safe(opt)+"'></label>")}if(q[0]==="reading")h+="<label>Reading passage<textarea data-passage='"+i+":"+j+"'>"+safe(q[2])+"</textarea></label>";h+="<p><strong>James's live response:</strong> <span data-live='"+i+":"+j+"'>"+safe(display)+"</span></p></div>"});h+="</details>"});$("teacher").innerHTML=h;$("downloadResponses").onclick=downloadResponses;$("saveLesson").onclick=async()=>{let updated=structuredClone(items);document.querySelectorAll("[data-title]").forEach(el=>updated[+el.dataset.title][0]=el.value);document.querySelectorAll("[data-question]").forEach(el=>{let[i,j]=el.dataset.question.split(":").map(Number);updated[i][2][j][1]=el.value});document.querySelectorAll("[data-option]").forEach(el=>{let[i,j,k]=el.dataset.option.split(":").map(Number);updated[i][2][j][2][k]=el.value});document.querySelectorAll("[data-passage]").forEach(el=>{let[i,j]=el.dataset.passage.split(":").map(Number);updated[i][2][j][2]=el.value});try{await setDoc(lessonDoc(),{sections:updated,updatedAt:serverTimestamp()},{merge:true});msg("Lesson edits saved")}catch(e){msg("Save failed: "+e.message)}}}
if(!FIREBASE_CONFIG||!STUDENT_EMAIL){$("authmsg").textContent="Setup pending: Laura must connect the existing Firebase web configuration before this lesson can be used.";$("signin").disabled=true}else{auth=getAuth(initializeApp(FIREBASE_CONFIG));db=getFirestore(auth.app);$("signin").onclick=async()=>{$("authmsg").textContent="Checking student credentials…";try{await signInWithEmailAndPassword(auth,$("email").value.trim().toLowerCase()==="jamesphan"?STUDENT_EMAIL:$("email").value.trim(),$("password").value)}catch(e){$("authmsg").textContent="Student sign-in failed: "+(e.code||e.message)}};onAuthStateChanged(auth,u=>{unsubscribe.forEach(f=>f());user=u;if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}teacher=u.email?.toLowerCase()===TEACHER_EMAIL;const allowed=teacher||u.email?.toLowerCase()===STUDENT_EMAIL.toLowerCase();if(!allowed){$("authmsg").textContent="This account is not assigned to James's lesson.";signOut(auth);return}$("login").classList.add("hidden");$("app").classList.remove("hidden");listen()});$("teacherSignin").onclick=async()=>{const b=$("teacherSignin");b.disabled=true;$("authmsg").textContent="Opening Google sign-in. Allow pop-ups if prompted.";const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account",login_hint:TEACHER_EMAIL});try{const r=await signInWithPopup(auth,p);$("authmsg").textContent="Signed in as "+r.user.email+". Loading dashboard."}catch(e){$("authmsg").textContent="Sign-in failed: "+(e.code||e.message)+". Check pop-up permissions."}finally{b.disabled=false}};$("signout").onclick=()=>signOut(auth)}
</script></body></html>
