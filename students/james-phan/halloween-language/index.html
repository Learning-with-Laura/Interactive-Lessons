<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>James's Halloween Language Adventure | Learning with Laura</title><style>
*{box-sizing:border-box}body{margin:0;font:17px system-ui;background:linear-gradient(135deg,#180d37,#45206d);color:#24183a}header{background:#1c1138;color:white;padding:20px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,38px)}header p{color:#f9ce7c}main{max-width:1040px;margin:20px auto;padding:0 14px}.panel{background:#fffaf1;border:4px solid #ffad35;border-radius:22px;padding:22px;box-shadow:0 12px 40px #12082088}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#6d39bd;color:white;margin:5px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.4}input,textarea{width:100%;padding:12px;border:2px solid #c7b2e6;border-radius:12px;margin:8px 0}textarea{min-height:115px}.option{display:block;width:100%;text-align:left;background:#f1e8ff;color:#27133d;border:2px solid #c5a6ef}.selected{background:#baf3da;border-color:#218d63}.bar{height:16px;background:#eee;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#54d6aa}.muted{color:#605476}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.question{padding:16px;background:white;border:2px solid #f0d8b3;border-radius:16px;margin:16px 0}.question h3{margin:0 0 12px}.teacher{background:#f4f0ff;padding:12px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;background:#fff1c9;border-radius:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><header><h1>🎃 James's Halloween Language Adventure 🦇</h1><p>Learning with Laura • Grade 6 • 120 minutes</p></header><main><div class="panel" id="login"><h2>🔐 Sign in</h2><p>Enter your Learning with Laura username and password.</p><input id="email" type="text" autocomplete="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button><p id="authmsg" role="status"></p></div><div id="app" class="panel hidden"><div class="row"><strong id="who"></strong><button id="signout">Sign out</button></div><p id="status" class="muted">Connecting…</p><div class="bar"><span id="bar" style="width:0%"></span></div><p id="progress"></p><div id="student"></div><div id="teacher" class="hidden"></div></div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,onSnapshot,setDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const FIREBASE_CONFIG=null; // Configure using the existing project's public Firebase web app configuration.
const TEACHER_EMAIL="laurademe6@gmail.com";
const STUDENT_EMAIL='jamesphan@example.com'; // Set to James's verified Firebase email after confirming his account.
const LESSON_ID="halloween-language-2026";
const BASE=[["🎃 Haunted House Warm-Up",10,[["choice","Who should check a clue before deciding what it means?",["Only Ethan","Everyone solving the mystery","Only Dad"],1],["text","James finds a mysterious note at the door. What should he do before making a decision?"]]],["🕸️ Broadest to Narrowest",15,[["order","Order these topics from broadest to narrowest.",["Halloween","Halloween costumes","Superhero Halloween costumes","Spider-Man Halloween costumes"]],["choice","Which topic is most specific?",["Family traditions","Halloween traditions","The Phan family's pumpkin-carving contest"],2],["text","Explain how you know one topic is narrower than another."]]],["🧪 Vocabulary Potion Lab",10,[["choice","What does the prefix pre- mean?",["After","Before","Against"],1],["choice","Which word means to look at something before it is officially shown?",["Preview","Rewrite","Misread"],0],["text","Use 'preview' and 'prepare' correctly in two sentences about Ethan, Paul or Isaac."]]],["👻 Organize the Haunted Clues",15,[["choice","Which detail belongs in a paragraph about decorating the porch?",["Dad hung glowing lanterns","Paul read a mystery novel","Isaac chose a board game"],0],["order","Put the paragraph in a logical order.",["Mom planned a spooky porch display.","First, Ethan arranged the pumpkins.","Next, Paul and Isaac placed the lanterns.","Finally, everyone admired the decorations."]],["text","Write a topic sentence about the family's Halloween preparations."]]],["🍬 Halloween Writing Workshop",20,[["choice","Which sentence gives the strongest supporting detail?",["It was fun.","Isaac gasped as a glowing pumpkin rolled across the porch.","Things happened."],1],["text","Write a 5–7 sentence paragraph about James and his brothers discovering a mysterious Halloween package. Include a topic sentence, three specific details and a conclusion."],["text","Reread your paragraph. Rewrite one sentence to make it more vivid."]]],["🦇 Reading Detective",15,[["reading","Read this short story carefully.","Ethan found a folded map beneath the welcome mat. James noticed that its corners were wet, although the porch was dry. Paul pointed to a tiny drawing of a pumpkin beside the garage. Isaac wanted to run straight there, but Mom suggested examining the map first. Dad noticed a second symbol hidden near the bottom. The family agreed to investigate together."],["choice","What is the strongest inference about the map?",["It may have been placed there recently.","It is definitely a treasure map.","Isaac drew it yesterday."],0],["choice","Which detail shows the family is being careful?",["The map has wet corners.","Mom suggests examining the map first.","There is a pumpkin drawing."],1],["text","What might the second symbol mean? Support your prediction with a detail from the story."]]],["🔍 Editor's Escape Room",15,[["choice","Choose the best revision: 'James went to the door. It was scary.'",["James went door scary.","James approached the creaking door as cold air slipped through the cracks.","James went to the door and it was scary."],1],["text","Edit this paragraph for capitals, punctuation and clarity: 'on halloween james and paul was looking for clues they seen a shadow near the garage ethan said lets check carefully'"],["choice","Which revision strategy is most effective?",["Submit immediately","Read aloud, check meaning and correct mistakes","Only count the words"],1]]],["🏆 Final Writing and Revision",20,[["choice","Which plan best supports a strong paragraph?",["Write quickly and stop","Topic sentence → supporting details → conclusion → review","List unrelated facts"],1],["text","Write 8–10 sentences about a Halloween mystery involving James, Ethan, Paul, Isaac, Mom and Dad. Include a clear beginning, specific details, transitions and a satisfying ending."],["text","Improve your story: identify one sentence you revised and explain why your new version is stronger."],["choice","Before submitting, what should you do?",["Check organization, details, spelling and punctuation","Only check the title","Nothing"],0]]]];
const $=id=>document.getElementById(id);
let auth,db,user,teacher=false,items=structuredClone(BASE),responses={},position=0,unsubscribe=[],ready=false;
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function msg(s){$("status").textContent=s}
function lessonDoc(){return doc(db,"students","james-phan","lessons",LESSON_ID)}
function answerDoc(){return doc(db,"students","james-phan","lessons",LESSON_ID,"responses","current")}
function listen(){unsubscribe.forEach(f=>f());unsubscribe=[];unsubscribe.push(onSnapshot(lessonDoc(),snap=>{if(snap.exists()&&Array.isArray(snap.data().sections))items=snap.data().sections;ready=true;render()},e=>msg("Lesson access: "+e.message)));unsubscribe.push(onSnapshot(answerDoc(),snap=>{if(snap.exists()){responses=snap.data().answers||{};if(teacher)position=snap.data().position||0;render()}},e=>msg("Responses access: "+e.message)))}
async function saveAnswer(key,val){responses[key]=val;try{await setDoc(answerDoc(),{answers:{[key]:val},updatedAt:serverTimestamp()},{merge:true});msg("☁️ Saved for Laura")}catch(e){msg("Save failed: "+e.message)}}
async function move(i){position=Math.max(0,Math.min(items.length-1,i));if(!teacher){try{await setDoc(answerDoc(),{position,updatedAt:serverTimestamp()},{merge:true})}catch(e){msg(e.message)}}render()}
function render(){if(!ready)return;$("who").textContent=teacher?"👩‍🏫 Laura's live teacher dashboard":"🧑‍🎓 James's lesson";$("bar").style.width=((position+1)/items.length*100)+"%";$("progress").textContent="Mission "+(position+1)+" of "+items.length+" • "+items[position][1]+" minutes";$("student").classList.toggle("hidden",teacher);$("teacher").classList.toggle("hidden",!teacher);if(teacher)renderTeacher();else renderStudent()}
function qkey(i,j){return "m"+i+"q"+j}
function renderStudent(){const section=items[position];let h="<h2>"+safe(section[0])+"</h2><p class='notice'>🧠 Think carefully. Explain your reasoning. Check before moving on.</p>";section[2].forEach((q,j)=>{let key=qkey(position,j);h+="<div class='question'><h3>"+(j+1)+". "+safe(q[1])+"</h3>";if(q[0]==="reading")h+="<p>"+safe(q[2])+"</p>";if(q[0]==="choice")q[2].forEach((opt,k)=>h+="<button class='option "+(responses[key]===k?"selected":"")+"' data-answer='"+j+"' data-value='"+k+"'>"+safe(opt)+"</button>");if(q[0]==="order"){let val=Array.isArray(responses[key])?responses[key]:q[2].slice().reverse();val.forEach((v,k)=>h+="<div class='row'><span>"+(k+1)+". "+safe(v)+"</span><button data-order='"+j+"' data-index='"+k+"' data-direction='-1' "+(k===0?"disabled":"")+">↑</button><button data-order='"+j+"' data-index='"+k+"' data-direction='1' "+(k===val.length-1?"disabled":"")+">↓</button></div>")}if(q[0]==="text")h+="<textarea data-text='"+j+"' placeholder='Type your answer here…'>"+safe(responses[key]||"")+"</textarea>";h+="</div>"});h+="<div class='row'><button id='prev' "+(position===0?"disabled":"")+">← Previous</button><button id='next' "+(position===items.length-1?"disabled":"")+">Next mission →</button></div>";$("student").innerHTML=h;$("prev").onclick=()=>move(position-1);$("next").onclick=()=>move(position+1);document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>saveAnswer(qkey(position,+b.dataset.answer),+b.dataset.value).then(render));document.querySelectorAll("[data-text]").forEach(t=>{let timer;t.oninput=()=>{const key=qkey(position,+t.dataset.text),value=t.value;responses[key]=value;clearTimeout(timer);timer=setTimeout(()=>saveAnswer(key,value),350)}});document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{let j=+b.dataset.order,key=qkey(position,j),q=items[position][2][j],v=Array.isArray(responses[key])?responses[key].slice():q[2].slice().reverse(),k=+b.dataset.index,n=k+(+b.dataset.direction);[v[k],v[n]]=[v[n],v[k]];saveAnswer(key,v).then(render)})}
function renderTeacher(){let h="<h2>📡 All missions and live responses</h2><p class='notice'>Questions and answer choices are always visible. Edit a field and select Save lesson to publish changes.</p><button id='saveLesson'>💾 Save lesson edits</button>";items.forEach((s,i)=>{h+="<details class='teacher' "+(i===position?"open":"")+"><summary><strong>Mission "+(i+1)+": "+safe(s[0])+"</strong> "+(i===position?"🟢 Current":"")+"</summary><label>Mission title<input data-title='"+i+"' value='"+safe(s[0])+"'></label>";s[2].forEach((q,j)=>{let key=qkey(i,j),answer=responses[key],display=answer===undefined?"⏳ Waiting for James":q[0]==="choice"?q[2][answer]??"Invalid selection":Array.isArray(answer)?answer.join(" → "):answer;h+="<div class='question'><small>"+safe(q[0])+"</small><label>Question<input data-question='"+i+":"+j+"' value='"+safe(q[1])+"'></label>";if(q[0]==="choice"||q[0]==="order"){q[2].forEach((opt,k)=>h+="<label>Choice "+(k+1)+"<input data-option='"+i+":"+j+":"+k+"' value='"+safe(opt)+"'></label>")}if(q[0]==="reading")h+="<label>Reading passage<textarea data-passage='"+i+":"+j+"'>"+safe(q[2])+"</textarea></label>";h+="<p><strong>James's live response:</strong> "+safe(display)+"</p></div>"});h+="</details>"});$("teacher").innerHTML=h;$("saveLesson").onclick=async()=>{let updated=structuredClone(items);document.querySelectorAll("[data-title]").forEach(el=>updated[+el.dataset.title][0]=el.value);document.querySelectorAll("[data-question]").forEach(el=>{let[i,j]=el.dataset.question.split(":").map(Number);updated[i][2][j][1]=el.value});document.querySelectorAll("[data-option]").forEach(el=>{let[i,j,k]=el.dataset.option.split(":").map(Number);updated[i][2][j][2][k]=el.value});document.querySelectorAll("[data-passage]").forEach(el=>{let[i,j]=el.dataset.passage.split(":").map(Number);updated[i][2][j][2]=el.value});try{await setDoc(lessonDoc(),{sections:updated,updatedAt:serverTimestamp()},{merge:true});msg("Lesson edits saved")}catch(e){msg("Save failed: "+e.message)}}}
if(!FIREBASE_CONFIG||!STUDENT_EMAIL){$("authmsg").textContent="Setup pending: Laura must connect the existing Firebase web configuration before this lesson can be used.";$("signin").disabled=true}else{auth=getAuth(initializeApp(FIREBASE_CONFIG));db=getFirestore(auth.app);$("signin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim().toLowerCase()==="jamesphan"?STUDENT_EMAIL:$("email").value.trim(),$("password").value)}catch(e){$("authmsg").textContent=e.message}};onAuthStateChanged(auth,u=>{unsubscribe.forEach(f=>f());user=u;if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}teacher=u.email?.toLowerCase()===TEACHER_EMAIL;const allowed=teacher||u.email?.toLowerCase()===STUDENT_EMAIL.toLowerCase();if(!allowed){$("authmsg").textContent="This account is not assigned to James's lesson.";signOut(auth);return}$("login").classList.add("hidden");$("app").classList.remove("hidden");listen()});$("signout").onclick=()=>signOut(auth)}
</script></body></html>
