rvest Time Detective",[["number","Estimate the number of minutes needed to review ten French vocabulary words."],["number","Estimate the number of minutes needed to check a project rubric and record its steps."],["choice","You planned 15 minutes but a task takes 30. What's the best response?",["Assume you're bad at planning","Use the new information to improve your next estimate","Stop planning altogether","Ignore the extra time"]],["order","Arrange these steps for starting a Math project.",["Read the project requirements","Identify what information you need","Choose a first small task","Start and review your progress"]],["text","Choose one real assignment. Break it into at least four steps."],["text","When will you do the first step? Be specific."]]],["🎃 Escape the Procrastination Maze",[["choice","You feel tired and want to scroll. A project is due soon. Which is the strongest starting strategy?",["Wait until you feel motivated","Set a short starter goal and begin","Do the easiest unrelated task","Tell yourself you will do it tomorrow"]],["multi","Which strategies can make a task easier to start?",["Open the assignment page","Set a short timer","Put the phone away","Choose the first tiny step"]],["choice","What is a helpful way to handle a task you don't enjoy?",["Connect it to a story or topic that interests you","Skip it","Wait for a parent to do it","Only work when it becomes urgent"]],["text","Choose a less interesting subject. How could you connect it to something you enjoy?"],["text","Describe your personal 'two-minute start' for a task you've been avoiding."]]],["🧩 Build Your Fall Week",[["multi","Which commitments should you plan around?",["Swimming","School assignments","Music practice","Evening routine"]],["choice","You have swimming Tuesday and Thursday evenings. When should you plan major homework?",["Only after swimming","Before busy evenings where possible","At bedtime","Only on the due date"]],["text","List this week's deadlines with the exact dates const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sections=structuredClone(BASE),answers={},page=0,teacher=false,ready=false,unsubs=[],saveTimer=null;
const lessonRef=doc(db,"lessonQuestions","ally_autumn_reset_20261102"),answerRef=doc(db,"lessonAnswers","ally_autumn_reset_20261102");
function key(i,j){return "m"+i+"q"+j}function status(t){$("status").textContent=t}function progress(){$("bar").style.width=((page+1)/sections.length*100)+"%";$("progress").textContent="🍁 Mission "+(page+1)+" of "+sections.length}
function display(q,a){if(a===undefined||a===null||a==="")return "⏳ Waiting for Ally";if(q[0]==="choice"||q[0]==="scale")return q[2][a]??String(a);return Array.isArray(a)?a.join(" → "):String(a)}
function save(k,v){answers[k]=v;clearTimeout(saveTimer);status("⏳ Saving…");saveTimer=setTimeout(async()=>{try{await setDoc(answerRef,{answers:{[k]:v},updatedAt:serverTimestamp()},{merge:true});status("☁️ Saved for Laura")}catch(e){status("⚠️ Could not save: "+e.message)}},250)}
function renderStudent(){const s=sections[page];if(!s)return;let h="<h2>"+esc(s[0])+"</h2><p class='notice'>🍂 Your answers save automatically. Take your time, think carefully, and have fun!</p>";s[1].forEach((q,j)=>{const k=key(page,j),v=answers[k];h+="<div class='question'><h3>"+(j+1)+". "+esc(q[1])+"</h3>";if(q[0]==="reading")h+="<p>"+esc(q[2])+"</p>";if(q[0]==="text"||q[0]==="number")h+=(q[0]==="number"?"<input type='number'":"<textarea")+" data-text='"+j+"' "+(q[0]==="number"?"value='"+esc(v??"")+"'>":">"+esc(v??"")+"</textarea>");if(["choice","scale","multi"].includes(q[0]))q[2].forEach((o,z)=>h+="<button class='option "+((q[0]==="multi"?Array.isArray(v)&&v.includes(z):v===z)?"chosen":"")+"' data-choice='"+j+"' data-value='"+z+"'>"+(q[0]==="multi"?(Array.isArray(v)&&v.includes(z)?"☑ ":"☐ "):"")+" "+esc(o)+"</button>");if(q[0]==="order"){let a=Array.isArray(v)?v:q[2].slice().reverse();a.forEach((o,z)=>h+="<div class='row'><strong>"+(z+1)+". "+esc(o)+"</strong><button data-order='"+j+"' data-index='"+z+"' data-dir='-1' "+(z===0?"disabled":"")+">↑</button><button data-order='"+j+"' data-index='"+z+"' data-dir='1' "+(z===a.length-1?"disabled":"")+">↓</button></div>")}h+="</div>"});h+="<div class='row'><button id='back' "+(page===0?"disabled":"")+">← Previous</button><button id='next' "+(page===sections.length-1?"disabled":"")+">Next mission →</button></div>"+(page===sections.length-1?"<p>🏆 You made it! Review your answers with Laura.</p>":"");$("student").innerHTML=h;

document.querySelectorAll("[data-choice]").forEach(e=>e.onclick=()=>{let j=+e.dataset.choice,z=+e.dataset.value,k=key(page,j),q=s[1][j];if(q[0]==="multi"){let a=Array.isArray(answers[k])?answers[k].slice():[];a=a.includes(z)?a.filter(x=>x!==z):[...a,z].sort();save(k,a)}else save(k,z);renderStudent()});

async function move(n){page=Math.max(0,Math.min(sections.length-1,n));render();window.scrollTo(0,0);try{await setDoc(answerRef,{answers:{},position:page,updatedAt:serverTimestamp()},{merge:true})}catch(e){status("⚠️ Progress could not save: "+e.message)}}
function renderTeacher(){let h="<h2>📡 Ally's Live Teacher Dashboard</h2><p class='notice'>All questions and answer choices are shown. Live answers appear below each question. Edit any prompt or option, then save to update Ally's lesson.</p><button id='saveEdits'>💾 Publish edits</button><button id='export'>⬇ Export Ally's answers (CSV)</button>";sections.forEach((s,i)=>{h+="<details class='teacherblock' "+(i===page?"open":"")+"><summary>🍁 Mission "+(i+1)+": "+esc(s[0])+" <span data-current='"+i+"'>"+(i===page?"🟢 Current":"")+"</span></summary><label>Mission title<input data-title='"+i+"' value='"+esc(s[0])+"'></label>";s[1].forEach((q,j)=>{h+="<div class='question'><small>"+esc(q[0])+"</small><label>Question<input data-question='"+i+":"+j+"' value='"+esc(q[1])+"'></label>";if(q[0]==="reading")h+="<label>Reading passage<textarea data-passage='"+i+":"+j+"'>"+esc(q[2])+"</textarea></label>";if(Array.isArray(q[2]))q[2].forEach((o,z)=>h+="<label>Option "+(z+1)+"<input data-option='"+i+":"+j+":"+z+"' value='"+esc(o)+"'></label>");h+="<strong>Ally's live response:</strong><div class='live' data-live='"+i+":"+j+"'>"+esc(display(q,answers[key(i,j)]))+"</div></div>"});h+="</details>"});$("teacher").innerHTML=h;$("saveEdits").onclick=async()=>{let updated=structuredClone(sections);document.querySelectorAll("[data-title]").forEach(e=>updated[+e.dataset.title][0]=e.value);document.querySelectorAll("[data-question]").forEach(e=>{let[i,j]=e.dataset.question.split(":").map(Number);updated[i][1][j][1]=e.value});document.querySelectorAll("[data-option]").forEach(e=>{let[i,j,z]=e.dataset.option.split(":").map(Number);updated[i][1][j][2][z]=e.value});document.querySelectorAll("[data-passage]").forEach(e=>{let[i,j]=e.dataset.passage.split(":").map(Number);updated[i][1][j][2]=e.value});try{await setDoc(lessonRef,{sections:updated.map(s=>({json:JSON.stringify(s)})),updatedAt:serverTimestamp()},{merge:true});status("🍁 Lesson edits published")}catch(e){status("⚠️ Edit failed: "+e.message)}}; function refreshLive(){document.querySelectorAll("[data-live]").forEach(e=>{let[i,j]=e.dataset.live.split(":").map(Number);e.textContent=display(sections[i][1][j],answers[key(i,j)])});document.querySelectorAll("[data-current]").forEach(e=>e.textContent=+e.dataset.current===page?"🟢 Current":"")}
function exportCsv(){const rows=[["Mission","Question","Type","Prompt","Options","Ally response"]];sections.forEach((s,i)=>s[1].forEach((q,j)=>rows.push([s[0],j+1,q[0],q[1],Array.isArray(q[2])?q[2].join(" | "):"",display(q,answers[key(i,j)])])));const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="Ally-Graham-Autumn-Reset-Responses.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function listen(){unsubs.forEach(f=>f());unsubs=[];ready=true;status("🟢 Connected. Live updates enabled.");render();unsubs.push(onSnapshot(lessonRef,s=>{if(s.exists()&&Array.isArray(s.data().sections))sections=s.data().sections.map(s=>s.json?JSON.parse(s.json):[s.title,s.questions.map(q=>[q.type,q.prompt,Array.isArray(q.payload)?q.payload.map(x=>x.value):q.payload])]);if(teacher)renderTeacher();else renderStudent()},e=>status("⚠️ Lesson access: "+e.message)));unsubs.push(onSnapshot(answerRef,s=>{if(s.exists()){const d=s.data();answers=d.answers||{};const next=Number.isInteger(d.position)?Math.max(0,Math.min(sections.length-1,d.position)):page;const changed=next!==page;page=next;progress();if(teacher)refreshLive();else if(changed)renderStudent()}},e=>status("⚠️ Response access: "+e.message)))}
