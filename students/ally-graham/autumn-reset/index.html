$("export").onclick=exportCsv}
function refreshLive(){document.querySelectorAll("[data-live]").forEach(e=>{let[i,j]=e.dataset.live.split(":").map(Number);e.textContent=display(sections[i][1][j],answers[key(i,j)])});document.querySelectorAll("[data-current]").forEach(e=>e.textContent=+e.dataset.current===page?"🟢 Current":"")}
function exportCsv(){const rows=[["Mission","Question","Type","Prompt","Options","Ally response"]];sections.forEach((s,i)=>s[1].forEach((q,j)=>rows.push([s[0],j+1,q[0],q[1],Array.isArray(q[2])?q[2].join(" | "):"",display(q,answers[key(i,j)])])));const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="Ally-Graham-Autumn-Reset-Responses.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function render(){progress();$("student").classList.toggle("hidden",teacher);$("teacher").classList.toggle("hidden",!teacher);if(teacher)renderTeacher();else renderStudent()}
function listen(){unsubs.forEach(f=>f());unsubs=[];ready=true;status("🟢 Connected. Live updates enabled.");render();unsubs.push(onSnapshot(lessonRef,s=>{if(s.exists()&&Array.isArray(s.data().sections))sections=BASE.map((original,i)=>{const saved=s.data().sections[i];if(!saved)return structuredClone(original);const parsed=saved.json?JSON.parse(saved.json):[saved.title,saved.questions.map(q=>[q.type,q.prompt,Array.isArray(q.payload)?q.payload.map(x=>x.value):q.payload])];return [parsed[0],[...parsed[1],...original[1].slice(parsed[1].length)]]});if(teacher)renderTeacher();else renderStudent()},e=>status("⚠️ Lesson access: "+e.message)));unsubs.push(onSnapshot(answerRef,s=>{if(s.exists()){const d=s.data();answers=d.answers||{};const next=Number.isInteger(d.position)?Math.max(0,Math.min(sections.length-1,d.position)):page;const changed=next!==page;page=next;progress();if(teacher)refreshLive();else if(changed)renderStudent()}},e=>status("⚠️ Response access: "+e.message)))}
$("studentLogin").onclick=async()=>{if($("username").value.trim().toLowerCase()!=="allyg"){$("authMessage").textContent="Please enter AllyG.";return}try{await signInWithEmailAndPassword(auth,EMAIL,$("password").value)}catch(e){$("authMessage").textContent="Sign-in failed. Check the password and the account email in Firebase."}};
$("teacherLogin").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("authMessage").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());ready=false;if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}teacher=u.email?.toLowerCase()===TEACHER&&u.providerData.some(p=>p.providerId==="google.com");if(!teacher&&u.uid!==UID){$("authMessage").textContent="This account is not assigned to Ally's lesson.";signOut(auth);return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=teacher?"👩‍🏫 Laura's dashboard":"🍁 Ally's autumn adventure";listen()});
</script></body></html>
