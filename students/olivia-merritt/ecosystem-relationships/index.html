   target.innerHTML='<h3>Olivia’s current section: '+safe(stageNames[current]||sections[current]?.[0]||'Unknown')+'</h3><p>Green highlighting indicates Olivia’s selected answer. All questions remain visible, including unanswered ones.</p>'+sections.map(([name,make],i)=>'<details '+(i===current?'open':'')+' style="margin:14px 0;border:1px solid #d7e3e9;border-radius:12px;padding:12px"><summary style="cursor:pointer;font-weight:700">'+safe(name)+(i===current?' • CURRENT':'')+'</summary>'+make()+'</details>').join('');
  },e=>{document.getElementById('teacherMessage').textContent='Firestore access error: '+(e.code||'unknown')});return;
 }
 teacher.hidden=true;gate.hidden=false;
 if(user?.uid!==uid){msg.textContent='Enter OliviaM and your password to begin.';return}
 msg.textContent='Loading saved work from Firebase…';
 try{const snapshot=await getDoc(record);
 if(snapshot.exists()&&snapshot.data().state){const cloud=snapshot.data().state;state={stage:cloud.stage||0,answers:cloud.answers||{},sort:cloud.sort||{},notes:cloud.notes||{}};localStorage.setItem('olivia_ecosystems_v1',JSON.stringify(state))}
 ready=true;gate.hidden=true;lesson.hidden=false;status.textContent='✓ Connected to Laura';render();
 }catch(e){gate.hidden=false;msg.textContent='Firebase access failed ('+(e.code||'unknown')+'). Ask Laura to check Firestore rules.'}
});
window.saveOliviaCloud=()=>{
 if(!ready||auth.currentUser?.uid!==uid)return;
 clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
 try{await setDoc(record,{student:'Olivia Merritt',uid,lesson:'Ecosystem Relationships',state:JSON.parse(JSON.stringify(state)),lastUpdated:serverTimestamp()},{merge:true});status.textContent='✓ Saved to Laura'}
 catch(e){status.textContent='⚠ Cloud save failed ('+(e.code||'unknown')+'). Tell Laura.'}
 },500);
};
</script>
