<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olivia's Ecosystem Adventure</title><style>
*{box-sizing:border-box}body{margin:0;font:17px system-ui;background:linear-gradient(130deg,#d5f8ef,#e6e1ff,#ffe6a8);color:#183b42}header{background:linear-gradient(110deg,#0c766b,#6261c9,#e16d8b);color:white;padding:28px;text-align:center}h1{margin:0;font-size:clamp(27px,5vw,43px)}main{max-width:1000px;margin:auto;padding:16px}.panel{background:#ffffffed;border-radius:23px;padding:23px;margin:16px 0;box-shadow:0 8px 30px #22465522}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill,.option,.chip{border:0;border-radius:14px;padding:13px 17px;font:inherit;cursor:pointer;background:#e3f3ff;color:#123c55}.pill.active,.primary{background:#176c79;color:white}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f0f0ff}.option:focus,.chip:focus{outline:3px solid #eb9b32}.correct{background:#c3f4d3!important}.wrong{background:#ffd4d4!important}.chip{background:#ffe2a2;margin:5px;touch-action:manipulation}.target{min-height:85px;border:3px dashed #8c85d9;border-radius:16px;padding:15px;margin:9px 0;background:#f8f7ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.tile{background:#f1fbfa;border-radius:15px;padding:16px}.art{font-size:65px;text-align:center}.bar{height:14px;background:#d5e8e8;border-radius:20px;overflow:hidden}.bar span{display:block;background:#19a78a;height:100%}textarea{width:100%;min-height:105px;border:2px solid #9fbbc0;border-radius:12px;padding:12px;font:inherit}small{color:#456}button:disabled{opacity:.6}#feedback{font-weight:700;min-height:28px}a{color:#135b7e}img{max-width:100%;border-radius:14px}svg{max-width:100%}@media(max-width:550px){.panel{padding:14px}}</style></head><body><header><h1>🌎 Olivia's Ecosystem Adventure 🦋</h1><p>Grade 6 Science • Mutualism • Commensalism • Parasitism</p></header><main><div class="panel"><div class="row"><strong>🧭 Learning with Laura</strong><span id="saved">Your progress saves on this device</span></div><div class="bar"><span id="bar"></span></div><p id="progress"></p><nav class="row" id="nav"></nav></div><section id="app"></section></main><script>
const lessons=[
{name:"Mutualism",sign:"+ / +",emoji:"🐝🌸",colour:"#ddfae8",definition:"Both organisms benefit from the relationship.",examples:[["🐝","Bee and flower","The bee gets nectar; the flower is pollinated."],["🐠","Clownfish and sea anemone","The clownfish gains protection; the anemone may gain nutrients and cleaning."],["🐦","Oxpecker and large mammal","When the bird eats ticks, it gets food and the mammal may have fewer parasites. This relationship can vary."]]},
{name:"Commensalism",sign:"+ / 0",emoji:"🐄🐦",colour:"#e3e9ff",definition:"One organism benefits; the other is neither significantly helped nor harmed.",examples:[["🐄","Cattle egret and grazing cattle","The bird catches insects stirred up by the cattle; the cattle are largely unaffected."],["🌳","Orchid growing on a tree","The orchid gets support and better access to sunlight; the tree is usually unaffected."],["🦈","Remora and shark","The remora can hitch a ride and obtain food scraps; the shark may be unaffected, although effects can vary."]]},
{name:"Parasitism",sign:"+ / −",emoji:"🐕🕷️",colour:"#ffe4e5",definition:"A parasite benefits while its host is harmed.",examples:[["🐕","Tick and dog","The tick feeds on the dog's blood; the dog loses blood and may be exposed to disease."],["🌱","Mistletoe and tree","Mistletoe takes water and nutrients from its host tree, which can be weakened."],["🪱","Tapeworm and human","The tapeworm takes nutrients from its host and can cause health problems."]]}]
const bank=[
["A bee gathers nectar and pollinates a flower. Which relationship?","Mutualism","Both gain something."],["An orchid grows on a tree without damaging it. Which relationship?","Commensalism","The orchid benefits while the tree is largely unaffected."],["A tick feeds on a dog's blood. Which relationship?","Parasitism","The tick benefits and the dog is harmed."],["A cattle egret catches insects stirred up by a cow. Which relationship?","Commensalism","The cow is largely unaffected."],["A clownfish lives among an anemone's tentacles and helps its host. Which relationship?","Mutualism","Both organisms can benefit."],["Mistletoe draws water and nutrients from a tree. Which relationship?","Parasitism","The host tree can be weakened."],["Two organisms both gain a benefit. Which relationship?","Mutualism","Both benefit: +/+."],["One organism benefits and the other is unaffected. Which relationship?","Commensalism","One benefits: +/0."],["One organism benefits and the other is harmed. Which relationship?","Parasitism","The host is harmed: +/−."],["A remora rides on a shark and eats leftover food, while the shark is unaffected. Which relationship?","Commensalism","The remora benefits."],["A tapeworm absorbs nutrients inside its host. Which relationship?","Parasitism","The host loses nutrients."],["A bird eats ticks off a large mammal, reducing the mammal's parasites. Which relationship?","Mutualism","Both benefit in this example."],["Which relationship is represented by +/+?","Mutualism","Both organisms benefit."],["Which relationship is represented by +/0?","Commensalism","One benefits, the other is unaffected."],["Which relationship is represented by +/−?","Parasitism","One benefits, the other is harmed."],["What is the organism harmed by a parasite called?","Host","The host is the organism a parasite lives on or in."],["What is a parasite?","An organism that benefits while harming a host","Parasites gain resources from hosts."],["Why does a bee visit a flower?","To collect nectar or pollen","The bee gets food resources."],["How can a flower benefit from a bee?","The bee transfers pollen","Pollination helps plants reproduce."],["Why can an orchid grow high on a tree?","To reach more light","The orchid uses the tree for support."],["What does the tick gain from a dog?","Blood as food","The tick is a blood-feeding parasite."],["Which best describes a cattle egret near cattle?","The egret catches disturbed insects","It gains easier access to prey."],["Which is a possible effect of mistletoe on its host?","Reduced water and nutrients for the tree","Mistletoe draws resources from the host."],["Can a relationship change depending on conditions?","Yes, effects can vary","Some examples depend on species and conditions."],["Why is parasitism different from predation?","A parasite typically lives on or in a host and takes resources over time","Predators typically kill and eat prey."],["A fish gets shelter in coral while the coral is unaffected. Which relationship?","Commensalism","Only the fish benefits in this scenario."],["A fungus and a plant exchange nutrients in a mutually beneficial partnership. Which relationship?","Mutualism","Both gain resources."],["A flea feeds on a cat and causes itching. Which relationship?","Parasitism","The flea benefits and the cat is harmed."],["A bird nests in a tree without affecting it. Which relationship?","Commensalism","The bird gains shelter."],["Two species help each other survive. Which relationship?","Mutualism","Each benefits."]
];
const optionsFor=(q)=>q[1]==="Host"?["Host","Predator","Producer","Prey"]:q[1]==="An organism that benefits while harming a host"?[q[1],"An organism that helps both species","An organism that makes its own food","An organism that never needs a host"]:["Mutualism","Commensalism","Parasitism",q[1]].filter((x,i,a)=>a.indexOf(x)===i);
const extra=[["A bee and a flower","Mutualism"],["An orchid on a tree","Commensalism"],["A tick on a dog","Parasitism"],["A cattle egret following cattle","Commensalism"],["A clownfish and anemone","Mutualism"],["Mistletoe on a tree","Parasitism"],["A flea on a cat","Parasitism"],["A bird nesting in a tree without affecting it","Commensalism"],["A fungus exchanging nutrients with a plant","Mutualism"],["A remora riding an unaffected shark","Commensalism"],["A tapeworm in a human","Parasitism"],["A bee pollinating a flower","Mutualism"]];
const stages=["🌱 Explore","🧩 Drag & Drop","🎯 Quick Quiz","🔎 Ecosystem Detective","🧠 Explain It","🏆 Final Challenge"];
let state;try{state=JSON.parse(localStorage.getItem("olivia_ecosystems_v1"))||{stage:0,answers:{},sort:{},notes:{}}}catch{state={stage:0,answers:{},sort:{},notes:{}}}
let selected="",feedback="",quizIndex=0;const $=s=>document.querySelector(s);const save=()=>{localStorage.setItem("olivia_ecosystems_v1",JSON.stringify(state));$("#saved").textContent="✓ Saved on this device";};const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function go(i){state.stage=i;save();render()}function render(){let i=state.stage;$("#nav").innerHTML=stages.map((s,j)=>'<button class="pill '+(i===j?'active':'')+'" onclick="go('+j+')">'+s+'</button>').join("");let done=Object.keys(state.answers).length+Object.keys(state.sort).length;$("#bar").style.width=Math.min(100,Math.round(done/72*100))+"%";$("#progress").textContent=done+" recorded responses • "+stages[i];if(i===0)learn();if(i===1)sorter();if(i===2)quiz("quick",0,15);if(i===3)detective();if(i===4)explain();if(i===5)quiz("final",15,30)}
function learn(){$("#app").innerHTML='<div class="panel"><h2>🌈 Discover three relationships</h2><p>Scientists use the word <strong>symbiosis</strong> for close, long-term relationships between different species. Ask: <em>Who benefits? Who is harmed?</em></p><div class="grid">'+lessons.map(l=>'<article class="tile" style="background:'+l.colour+'"><div class="art">'+l.emoji+'</div><h2>'+l.name+'</h2><h3>'+l.sign+'</h3><p>'+l.definition+'</p>'+l.examples.map(e=>'<p><strong>'+e[0]+' '+e[1]+'</strong><br>'+e[2]+'</p>').join('')+'</article>').join('')+'</div><p><strong>Memory trick:</strong> Mutual = both; Commensal = one gains, other neutral; Parasite = takes from a host.</p><button class="pill primary" onclick="go(1)">Try drag and drop →</button></div>'}
function sorter(){let remaining=extra.map((e,i)=>i).filter(i=>!state.sort[i]);$("#app").innerHTML='<div class="panel"><h2>🧩 Sort the relationships</h2><p>Drag a scenario into the correct category. You can also tap a scenario and then tap a category. Each correct placement is saved.</p><p><strong>'+Object.keys(state.sort).length+' / '+extra.length+' correctly sorted</strong></p><div class="row">'+remaining.map(i=>'<button class="chip" draggable="true" ondragstart="selectSort('+i+')" onclick="selectSort('+i+')">'+esc(extra[i][0])+'</button>').join('')+'</div><div class="grid">'+lessons.map(l=>'<div class="target" ondragover="event.preventDefault()" ondrop="event.preventDefault();placeSort(\''+l.name+'\')" onclick="placeSort(\''+l.name+'\')"><h3>'+l.emoji+' '+l.name+'</h3><p>'+l.sign+'</p>'+extra.map((e,i)=>state.sort[i]===l.name?'<p>✓ '+esc(e[0])+'</p>':'').join('')+'</div>').join('')+'</div><p id="feedback">'+feedback+'</p><button class="pill" onclick="go(2)">Next: quick quiz →</button></div>'}
window.selectSort=i=>{selected=String(i);feedback="Selected: "+extra[i][0]+". Choose a category.";$("#feedback").textContent=feedback};window.placeSort=category=>{if(selected==="")return;let i=Number(selected);if(extra[i][1]===category){state.sort[i]=category;selected="";feedback="✅ Correct!";save();sorter()}else{$("#feedback").textContent="💡 Not quite. Think about who benefits and who is harmed."}};
function quiz(prefix,start,end){let qs=bank.slice(start,end);$("#app").innerHTML='<div class="panel"><h2>'+(prefix==="quick"?"🎯 Quick Quiz":"🏆 Final Challenge")+'</h2><p>Questions '+(start+1)+'–'+end+' of 30. Choose an answer and get instant feedback.</p><div id="questions">'+qs.map((q,k)=>{let id=prefix+k,a=state.answers[id],opts=optionsFor(q);if(opts.length<4){opts=[...opts,...["A producer","A predator","A decomposer","None of these"]].filter((x,i,arr)=>arr.indexOf(x)===i).slice(0,4)}return '<div class="tile" style="margin:12px 0"><h3>Question '+(start+k+1)+'. '+esc(q[0])+'</h3>'+opts.map(o=>'<button class="option '+(a===o?(o===q[1]?"correct":"wrong"):"")+'" onclick="answer(\''+id+'\',\''+encodeURIComponent(o)+'\')">'+esc(o)+'</button>').join('')+'<p id="f'+id+'">'+(a?(a===q[1]?"✅ Correct! ":"💡 Correct answer: "+esc(q[1])+". ")+esc(q[2]):"")+'</p></div>'}).join('')+'</div><button class="pill primary" onclick="go('+(prefix==="quick"?3:0)+')">'+(prefix==="quick"?"Next: detective →":"Review concepts ↻")+'</button></div>'}
window.answer=(id,encoded)=>{state.answers[id]=decodeURIComponent(encoded);save();render()};
function detective(){let cases=[["🌊","A small fish hides among sea urchin spines, while the urchin is unaffected.","Commensalism"],["🌼","A butterfly drinks nectar and transfers pollen between flowers.","Mutualism"],["🐕","A flea feeds on a dog, leaving itchy bites.","Parasitism"],["🌳","An orchid uses a tree trunk for support without taking nutrients from it.","Commensalism"],["🍄","A fungus helps plant roots absorb minerals and receives sugars.","Mutualism"],["🌿","Mistletoe draws water from a host tree.","Parasitism"]];$("#app").innerHTML='<div class="panel"><h2>🔎 Ecosystem Detective</h2><p>Read each case, identify the relationship and explain the evidence aloud to Laura.</p>'+cases.map((c,i)=>'<div class="tile" style="margin:12px 0"><div class="art">'+c[0]+'</div><h3>Case '+(i+1)+': '+c[1]+'</h3><div class="row">'+lessons.map(l=>'<button class="pill" onclick="caseAnswer('+i+',\''+l.name+'\')">'+l.name+'</button>').join('')+'</div><p id="case'+i+'">'+(state.answers["case"+i]?"Your answer: "+state.answers["case"+i]+(state.answers["case"+i]===c[2]?" ✓":" • Try again"):"")+'</p></div>').join('')+'<button class="pill primary" onclick="go(4)">Next: explain it →</button></div>';window.cases=cases}
window.caseAnswer=(i,v)=>{state.answers["case"+i]=v;save();$("#case"+i).textContent=v===window.cases[i][2]?"✅ Correct! "+v:"💡 Try again: which organisms benefit or suffer?"};
function explain(){let prompts=["Explain mutualism in your own words. Give a real example.","How is commensalism different from mutualism?","Explain how a parasite benefits and its host is harmed.","Invent a new ecosystem scenario and identify its relationship.","Why might scientists disagree about whether one relationship is truly commensal?","What clues would you look for when classifying a relationship?"];$("#app").innerHTML='<div class="panel"><h2>🧠 Explain Like a Scientist</h2><p>Use complete sentences. Your work saves automatically on this device.</p>'+prompts.map((p,i)=>'<div class="tile" style="margin:12px 0"><h3>Question '+(i+1)+'. '+p+'</h3><textarea oninput="note('+i+',this.value)" placeholder="Write your explanation here...">'+esc(state.notes[i]||"")+'</textarea></div>').join('')+'<button class="pill primary" onclick="go(5)">Final challenge →</button><button class="pill" onclick="exportCSV()">⬇ Download responses (CSV)</button></div>'}
window.note=(i,v)=>{state.notes[i]=v;save()};window.exportCSV=()=>{let rows=[["Type","Question","Answer"],...Object.entries(state.answers).map(([k,v])=>["Response",k,v]),...Object.entries(state.sort).map(([k,v])=>["Sort",extra[k][0],v]),...Object.entries(state.notes).map(([k,v])=>["Written",String(Number(k)+1),v])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Olivia-Ecosystem-Responses.csv";a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
