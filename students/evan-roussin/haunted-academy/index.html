<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evan • Haunted Academy | Learning with Laura</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#553080,#160f2c 65%);font:17px system-ui;color:#241a37}header{color:#fff;text-align:center;padding:26px 12px}h1{font-size:clamp(25px,4vw,42px);margin:4px}header p{color:#ffcb79}main{max-width:1050px;margin:auto;padding:0 14px 50px}.panel{background:#fff9ee;border:3px solid #f7a537;border-radius:20px;padding:24px;box-shadow:0 12px 36px #0005}.hidden{display:none!important}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:2px solid #c8b4e8;border-radius:10px;margin:7px 0 12px}textarea{min-height:120px}button{border:0;background:#723ac1;color:white;border-radius:11px;padding:11px 14px;margin:5px;cursor:pointer}button:disabled{opacity:.45}.option{display:block;width:100%;text-align:left;background:#ede2ff;color:#25163c;border:2px solid #cbb1ef}.selected{background:#c5f3d8;border-color:#168b59}.question{border:2px solid #eed6a6;background:white;border-radius:14px;padding:16px;margin:12px 0}.question h3{margin:0 0 12px}.muted{color:#645775}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.bar{height:14px;background:#d8c8e8;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#40cba1}.mission{background:#f3ecff;padding:14px;border-radius:13px;margin:12px 0}details{border:1px solid #cfb7e4;background:#f6f0ff;border-radius:12px;margin:10px 0;padding:13px}summary{cursor:pointer;font-weight:700}.answer{background:#dff6ed;padding:12px;border-radius:10px;white-space:pre-wrap}.small{font-size:14px}.illustration{font-size:65px;text-align:center;background:linear-gradient(90deg,#271343,#854ca4);border-radius:16px;padding:16px;margin:12px 0}label{display:block;font-weight:600;margin-top:10px}#status{min-height:25px}nav{display:flex;flex-wrap:wrap}.teacherq{padding:12px;background:white;border-radius:12px;margin:10px 0}@media(max-width:600px){.panel{padding:14px}}.course-scroll{overflow-x:auto;margin:12px 0}.course-table{width:100%;border-collapse:collapse;font-size:14px;min-width:920px}.course-table th,.course-table td{padding:9px;border:1px solid #d8c9e8;vertical-align:top}.course-table th{background:#f0e7ff;text-align:left}.course-table input,.course-table select{font-size:14px;min-width:140px;margin:0;padding:8px;width:100%;border:1px solid #bca3df;border-radius:7px}.course-reflect{display:grid;gap:8px}.course-reflect textarea{min-height:70px}.skill-explain{padding:16px;border-radius:12px;background:#f2eaff;line-height:1.55}.video-box{margin:15px 0;padding:16px;background:#fff4d9;border:1px solid #efc46d;border-radius:12px}.video-box a{color:#502e96;font-weight:700}.assessment-row{background:#f5efff;padding:14px;border-radius:12px;margin:12px 0}.assessment-options{display:flex;flex-wrap:wrap;gap:5px}.assessment-options button{font-size:13px;margin:3px;padding:9px}.assessment-report p{margin:8px 0}</style></head><body><header><h1>🎃 The Haunted Academy 🦇</h1><p>Escape the Procrastination Curse • Evan • 11th Grade IB • Extended deep-dive adventure</p></header><main><div id="login" class="panel"><h2>🔐 Sign in</h2><p>Use your Learning with Laura student username and password.</p><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="studentLogin">Student sign in</button><button id="teacherLogin">Laura: Google sign in</button><p id="authMessage"></p></div><div id="app" class="panel hidden"><div class="row"><strong id="who"></strong><button id="logout">Sign out</button></div><p id="status" aria-live="polite"></p><div class="bar"><span id="bar"></span></div><p id="progress"></p><div id="student"></div><div id="teacher" class="hidden"></div></div></main><script type="module">
import{courseStudent,courseTeacher}from"./course-dashboard.js";
import{EF_CURRICULUM}from"./ef-curriculum.js";
import{studentWidget,teacherWidget}from"./ef-widgets.js";
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,onSnapshot,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const config={apiKey:"AIzaSyC7y-jx-LMOJyjtbLHuChc3yEGZXlQrtZ8",authDomain:"live-learning-with-laura.firebaseapp.com",projectId:"live-learning-with-laura",storageBucket:"live-learning-with-laura.firebasestorage.app",messagingSenderId:"846701984036",appId:"1:846701984036:web:0447c64aef753c1c1e1bb1"};
const TEACHER="laurademe6@gmail.com",STUDENT="evanroussin@example.com",LESSON="haunted-academy-2026",BASE=EF_CURRICULUM;
const $=id=>document.getElementById(id),safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const auth=getAuth(initializeApp(config)),db=getFirestore(auth.app);let teacher=false,sections=structuredClone(BASE),answers={},position=0,unsubs=[],loaded=false,dirty=false,responseLoaded=false;
const lessonRef=()=>doc(db,"students","evan-roussin","lessons",LESSON);
const responseRef=()=>doc(db,"students","evan-roussin","lessons",LESSON,"responses","current");
function status(s){$("status").textContent=s}
function subscribe(){unsubs.forEach(f=>f());unsubs=[];loaded=true;responseLoaded=false;unsubs.push(onSnapshot(lessonRef(),s=>{if(s.exists()&&Array.isArray(s.data().sections)&&s.data().curriculumVersion===2)sections=s.data().sections;if(!dirty)render()},e=>status("Lesson access error: "+e.message)));unsubs.push(onSnapshot(responseRef(),s=>{if(s.exists()){answers=s.data().answers||{};if(teacher)position=s.data().position||0;else if(!sessionStorage.getItem("evan-position-loaded")){position=s.data().position||0;sessionStorage.setItem("evan-position-loaded","1")}if(teacher||!responseLoaded)render();responseLoaded=true}},e=>status("Response access error: "+e.message)));render()}
async function saveAnswer(key,value){answers[key]=value;try{await setDoc(responseRef(),{answers:{[key]:value},updatedAt:serverTimestamp()},{merge:true});status("☁️ Saved for Laura")}catch(e){status("⚠️ Save failed: "+e.message)}}
async function move(n){position=Math.max(0,Math.min(sections.length-1,n));if(!teacher){try{await setDoc(responseRef(),{position,updatedAt:serverTimestamp()},{merge:true})}catch(e){status("Progress save failed: "+e.message)}}render()}
function render(){if(!loaded)return;$("who").textContent=teacher?"👩‍🏫 Laura • Live teacher dashboard":"🧑‍🎓 Evan • Student adventure";$("student").classList.toggle("hidden",teacher);$("teacher").classList.toggle("hidden",!teacher);$("bar").style.width=((position+1)/sections.length*100)+"%";$("progress").textContent="Mission "+(position+1)+" of "+sections.length;teacher?renderTeacher():renderStudent()}
function inputFor(q,key){const v=answers[key];if(q.type==="choice"||q.type==="multi"){return q.options.map((opt,i)=>'<button class="option '+((q.type==="choice"?v===i:Array.isArray(v)&&v.includes(i))?"selected":"")+'" data-option="'+i+'">'+safe(opt)+'</button>').join("")}if(q.type==="order"){let order=Array.isArray(v)?v:q.options.map((_,i)=>i);return order.map((idx,i)=>'<div class="row"><span>'+(i+1)+'. '+safe(q.options[idx])+'</span><button data-order="'+i+':-1" '+(i===0?"disabled":"")+'>↑</button><button data-order="'+i+':1" '+(i===order.length-1?"disabled":"")+'>↓</button></div>').join("")}if(q.type==="scale")return [1,2,3,4,5].map(i=>'<button class="'+(v===i?"selected":"")+'" data-scale="'+i+'">'+i+'</button>').join("");if(q.type==="date")return '<input type="date" data-entry value="'+safe(v||"")+'">';if(q.type==="number")return '<input type="number" data-entry value="'+safe(v||"")+'">';return '<textarea data-entry placeholder="Write your response here...">'+safe(v||"")+'</textarea>'}
function renderStudent(){const m=sections[position],q=m.questions[0],key=m.id+"_"+q.id;if(q.type==="courseChart"){$("student").innerHTML='<div class="mission"><h2>🏰 The Course Castle: Weekly Check-In</h2><p>Mission 1</p></div><p>Check your school portal and update each course. Enter the next real deadline, including its date. Choose a status for every class.</p><div id="courseHost"></div><nav><button id="next">Next mission →</button></nav>';$("courseHost").append(courseStudent(answers[key],value=>saveAnswer(key,value)));$("next").onclick=()=>move(position+1);return}if(q.type==="lesson"||q.type==="selfAssessment"){$("student").innerHTML='<div class="mission"><h2>'+safe(m.title)+'</h2></div><div id="efWidget"></div><nav><button id="prev">← Previous</button><button id="next">Next mission →</button></nav>';$("efWidget").append(studentWidget(q,answers[key],value=>saveAnswer(key,value)));$("prev").onclick=()=>move(position-1);$("next").onclick=()=>move(position+1);return}$("student").innerHTML='<div class="mission"><h2>'+safe(m.title)+'</h2><p>Mission '+(position+1)+'</p></div><div class="illustration" aria-hidden="true">'+["🏰🌙🦇","🎃🕸️🔮","👻📚🕯️","🧙‍♂️⚗️✨"][position%4]+'</div><div class="question"><h3>'+safe(q.prompt)+'</h3>'+inputFor(q,key)+'</div><nav><button id="prev" '+(position===0?"disabled":"")+'>← Previous</button><button id="next" '+(position===sections.length-1?"disabled":"")+'>Next mission →</button></nav>';$("prev").onclick=()=>move(position-1);$("next").onclick=()=>move(position+1);
$("student").querySelectorAll("[data-option]").forEach(b=>b.onclick=async()=>{let i=+b.dataset.option,v=q.type==="multi"?(Array.isArray(answers[key])?[...answers[key]]:[]):i;if(q.type==="multi"){v=v.includes(i)?v.filter(x=>x!==i):[...v,i]}await saveAnswer(key,v);renderStudent()});
$("student").querySelectorAll("[data-scale]").forEach(b=>b.onclick=async()=>{await saveAnswer(key,+b.dataset.scale);renderStudent()});
$("student").querySelectorAll("[data-order]").forEach(b=>b.onclick=async()=>{let [i,d]=b.dataset.order.split(":").map(Number),v=Array.isArray(answers[key])?[...answers[key]]:q.options.map((_,i)=>i),j=i+d;[v[i],v[j]]=[v[j],v[i]];await saveAnswer(key,v);renderStudent()});
const entry=$("student").querySelector("[data-entry]");if(entry){let t;entry.oninput=()=>{const value=entry.value;answers[key]=value;clearTimeout(t);t=setTimeout(()=>saveAnswer(key,value),400)};entry.onchange=()=>saveAnswer(key,entry.value)}}
function display(q,v){if(v===undefined)return"⏳ Not answered";if(q.type==="choice")return q.options[v]??"Choice changed";if(q.type==="multi")return(Array.isArray(v)?v.map(i=>q.options[i]??"Choice changed").join(" • "):String(v));if(q.type==="order")return(Array.isArray(v)?v.map(i=>q.options[i]??"Choice changed").join(" → "):String(v));return String(v)}
function renderTeacher(){let h='<h2>📡 All missions • Live responses</h2><p>Past, current and upcoming questions are listed. Edit prompts and choices, then select Publish edits. Student changes appear through live synchronisation.</p><button id="publish">💾 Publish lesson edits</button><button id="refresh">↻ Discard unsaved edits</button>';sections.forEach((m,i)=>{const q=m.questions[0],key=m.id+"_"+q.id;h+='<details '+(i===position?'open':'')+'><summary>Mission '+(i+1)+' '+safe(m.title)+' '+(i===position?'🟢 Current':'')+'</summary><div class="teacherq"><label>Mission title<input data-title="'+i+'" value="'+safe(m.title)+'"></label><label>Question<textarea data-prompt="'+i+'">'+safe(q.prompt)+'</textarea></label>';q.options.forEach((o,k)=>h+='<label>Choice '+(k+1)+'<input data-choice="'+i+':'+k+'" value="'+safe(o)+'"></label>');h+='<strong>Evan’s response</strong><div class="answer">'+(q.type==="courseChart"?courseTeacher(answers[key]):(teacherWidget(q,answers[key])??safe(display(q,answers[key]))))+'</div></div></details>'});$("teacher").innerHTML=h;
$("teacher").querySelectorAll("input,textarea").forEach(el=>el.oninput=()=>{dirty=true;status("Unsaved teacher edits")});
$("publish").onclick=async()=>{let updated=structuredClone(sections);document.querySelectorAll("[data-title]").forEach(e=>updated[+e.dataset.title].title=e.value);document.querySelectorAll("[data-prompt]").forEach(e=>updated[+e.dataset.prompt].questions[0].prompt=e.value);document.querySelectorAll("[data-choice]").forEach(e=>{let[i,k]=e.dataset.choice.split(":").map(Number);updated[i].questions[0].options[k]=e.value});try{await setDoc(lessonRef(),{sections:updated,curriculumVersion:2,updatedAt:serverTimestamp()},{merge:true});sections=updated;dirty=false;status("✓ Teacher edits published");render()}catch(e){status("⚠️ Edit failed: "+e.message)}};
$("refresh").onclick=()=>{dirty=false;render();status("Unsaved edits discarded")}}
$("studentLogin").onclick=async()=>{const u=$("username").value.trim().toLowerCase();if(u!=="evanroussin"&&u!==STUDENT){$("authMessage").textContent="Use Evan's assigned username.";return}try{await signInWithEmailAndPassword(auth,STUDENT,$("password").value)}catch(e){$("authMessage").textContent="Sign in failed: "+e.message}};
$("teacherLogin").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("authMessage").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];loaded=false;sessionStorage.removeItem("evan-position-loaded");if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}teacher=u.email?.toLowerCase()===TEACHER;if(!teacher&&u.email?.toLowerCase()!==STUDENT){$("authMessage").textContent="This account is not assigned to Evan's lesson.";signOut(auth);return}$("login").classList.add("hidden");$("app").classList.remove("hidden");subscribe()});
</script></body></html>
