const PAGES=[{"kind":"intro","phase":"Welcome","title":"The rescue lab is open","student":"Ready to help the team?","teacher":"Welcome Noah. You control the missions. Tell him he can point, click, speak, or move letter tiles. No typing except an occasional single letter. Ask him to choose START.","choices":["Start"],"answer":0,"automatic":true},{"kind":"teach","phase":"1 · Discover","title":"Our four sounds","student":"m    a    p    t","tiles":["m","a","p","t"],"teacher":"Briefly assess EACH letter-sound correspondence without modelling first. Point to each: 'What sound?' Do not accept the letter name as evidence of sound knowledge. Mark prompting. If not independent, immediately model the sound and have Noah repeat. Do not rush."},{"kind":"teach","phase":"1 · Discover","title":"Hear the sounds","student":"/m/   /ă/   /p/","teacher":"Say each sound clearly without adding 'uh': /mmm/, short /ă/, /p/. Ask Noah to echo each sound. You model first, then together, then he tries. The slash notation is for Laura only.","tiles":["m","a","p"]},{"kind":"choice","phase":"1 · Discover","title":"Listen and choose","student":"Tap the letter you hear.","teacher":"Say ONLY /m/ without showing the word or naming the letter. If Noah misses it, model and let him try again; mark prompts.","choices":["t","m","p"],"answer":1,"automatic":true},{"kind":"choice","phase":"1 · Discover","title":"Listen and choose","student":"Tap the letter you hear.","teacher":"Say ONLY the short /ă/ sound. Don't say 'apple' because that may cue the answer.","choices":["a","p","t"],"answer":0,"automatic":true},{"kind":"teach","phase":"2 · Blend","title":"Listen, then say it","student":"/mmm/  /ă/  /p/","teacher":"PHONEMIC AWARENESS BEFORE PRINT. Hide/ignore the print on screen as needed, and say the three sounds slowly, blending them together into 'map'. Model: 'Listen: /mmm/ /ă/ /p/ ... map.' Then repeat together. This is teaching, not a score.","display":"oral"},{"kind":"teach","phase":"2 · Blend","title":"Watch me blend","student":"m      a      p","tiles":["m","a","p"],"teacher":"Touch under each letter while saying the sound. Sweep your finger left to right and say 'map'. Repeat twice. Explain these are sounds that join to form one word. Noah watches first."},{"kind":"teach","phase":"2 · Blend","title":"Blend with me","student":"m      a      p","tiles":["m","a","p"],"teacher":"Point to each letter. Say the sounds TOGETHER with Noah and blend 'map'. Then ask him to try alone. Record support level. If unsuccessful, repeat the model rather than guessing."},{"kind":"oral","phase":"2 · Blend","title":"Try it yourself","student":"m      a      p","tiles":["m","a","p"],"teacher":"Independent probe: Ask Noah to say the sounds and blend. Wait at least five seconds. Record independent / cue / repeated / modelled, and correct or still learning. Do not show a map picture."},{"kind":"movement","phase":"Movement break","title":"Power-Up 1","student":"Listen. Remember. Move.","steps":["Stand behind your chair","March three times","Sit with your arms crossed"],"teacher":"Say the three steps once. Ask Noah to repeat them BEFORE doing them. Expect cues/repetition at this stage. Record actual prompting, not independent success."},{"kind":"reward","phase":"Rescue partner","title":"Choose your partner","student":"Choose one.","choices":["Pikachu","Eevee","Bulbasaur"],"automatic":true},{"kind":"teach","phase":"3 · Change one sound","title":"One sound changes","student":"m a p  →  m a t","tiles":["m","a","p"],"afterTiles":["m","a","t"],"teacher":"MODEL a word chain: 'map' becomes 'mat' by changing only the last sound /p/ to /t/. Point to the change. Say /m/ /ă/ /t/, then blend 'mat'. Do not ask him to work it out before teaching."},{"kind":"teach","phase":"3 · Change one sound","title":"Read together","student":"m    a    t","tiles":["m","a","t"],"teacher":"Model once, then blend together, then try independent. Ask which sound changed from map. Accept oral or pointing responses."},{"ki dent sentence reading."},{"kind":"tiles","phase":"5 · Read and understand","title":"Make MAP","student":"Listen. Build the word.","target":"map","pool":["p","t","a","m"],"teacher":"CUMULATIVE RETRIEVAL: Say 'map' without showing a picture; ask Noah to say sounds and build. This revisits the first word after two sound changes.","automatic":true},{"kind":"movement","phase":"Movement break","title":"Power-Up 4","student":"Listen. Remember. Move.","steps":["Stand beside your chair","Turn once","Sit with your hands folded"],"teacher":"Observe retention and sequencing. Give prompts as required. Do not score a cued completion as independent."},{"kind":"reward","phase":"Rescue partner","title":"Choose your partner","student":"Choose one.","choices":["Machop","Magnemite","Voltorb"],"automatic":true},{"kind":"math","phase":"6 · Math investigation","title":"The parts counter","student":"Four gears. Three more arrive. How many now?","choices":["6","7","8","9"],"answer":1,"teacher":"Read aloud. Ask Noah to predict first. Allow counters or fingers; then ask how he knows. This assesses addition, not reading.","automatic":true},{"kind":"math","phase":"6 · Math investigation","title":"Try without counters","student":"8 + 5 = ?","choices":["11","12","13","14"],"answer":2,"teacher":"Ask whether he can solve mentally; if not offer counters. Record strategy. If he struggles, explicitly model counting-on rather than cycling guesses.","automatic":true},{"kind":"math","phase":"6 · Math investigation","title":"Parts used","student":"12 gears. Use 4. How many are left?","choices":["6","7","8","9"],"answer":2,"teacher":"Read aloud. Allow objects, number line, counting back. Ask why the answer makes sense.","automatic":true},{"kind":"math","phase":"6 · Math investigation","title":"Explain your thinking","student":"Which is greater: 47 or 74?","choices":["47","74"],"answer":1,"teacher":"Read the two numbers aloud if needed. Ask him to explain using tens and ones. If he has not learned place value, note that and model rather than guessing.","automatic":true},{"kind":"movement","phase":"Movement break","title":"Power-Up 5","student":"Listen. Remember. Move.","steps":["Reach both arms wide","Tap your knees twice","Cross your arms"],"teacher":"Have Noah repeat before moving; track prompt level."},{"kind":"reward","phase":"Rescue partner","title":"Choose your partner","student":"Choose one.","choices":["Pidgey","Growlithe","Poliwag"],"automatic":true},{"kind":"science","phase":"7 · Science investigation","title":"Robot power","student":"What happens when a circuit is open?","visual":"circuit","choices":["Motor stops","Motor runs"],"answer":0,"teacher":"TEACH FIRST: Point to the diagram, identify the battery, open switch and motor. Explain that the gap prevents electricity flowing. THEN ask which consequence follows. This is conceptual reasoning; read choices aloud.","automatic":true},{"kind":"science","phase":"7 · Science investigation","title":"Test one thing","student":"Two motors are identical. Only one has a battery connected. Which can run?","choices":["Motor with battery","Motor without battery"],"answer":0,"teacher":"Read choices aloud, discuss that energy is needed. This simplified model assumes the battery and connections work. Ask him to justify.","automatic":true},{"kind":"oral","phase":"7 · Science investigation","title":"Think like an engineer","student":"A robot wheel spins, but the robot stays still. What could we test?","teacher":"Open question: accept multiple plausible hypotheses (wheel loose, slipping, not contacting floor, axle connection). Ask what he would check FIRST and why. Do not force a single right answer."},{"kind":"movement","phase":"Movement break","title":"Power-Up 6","student":"Listen. Remember. Move.","steps":["Touch your shoulders","March three times","Sit quietly"],"teacher":"Repeat-directions-before-action. Record independence versus cues."},{"kind":"reward","phase":"Rescue partner","title":"Choose your partner","student":"Choose one.","choices":["Onix","Ditto","Abra"],"automatic":true},{"kind":"oral","phase":"8 · Independent check","title":"Read what you know","student":"map    mat    pat    tap","wordCards":["map","mat","pat","tap"],"teacher":"CUMULATIVE PROBE: Present one card at a time and ask Noah to decode WITHOUT pictures or saying the word first. Record each word correct/with prompting/not yet. You may revisit the cards after recording."},{"kind":"oral","phase":"8 · Independent check","title":"Final sound check","student":"m    a    p    t","tiles":["m","a","p","t"],"teacher":"Randomly point to each letter. Ask for SOUNDS, not letter names. Note any that require prompting. Then end positively with effort-specific feedback."},{"kind":"finish","phase":"8 · Review","title":"Rescue mission complete","student":"You practised reading, thinking, and remembering!","teacher":"Summarize evidence: independent letter sounds, blended words, spelling tiles, addition strategy, three-step working memory prompting. Determine next lesson from actual mastery; don't automatically advance phonics."}];

async function writeState(next,updatedAnswers=answers,updatedNotes=notes){if(!connected)throw Error('Live connection is not ready');await setDoc(ref,{answers:updatedAnswers,notes:updatedNotes,current:clamp(next),studentEmail,updatedAt:new Date().toISOString()});}
async function complete(v){if(teacher||!connected||busy)return;const at=remote;busy=true;answers={...answers,[at]:v};$('feedback').textContent='✓ Saved';[...$('options').querySelectorAll('button')].forEach(b=>b.disabled=true);
try{await writeState(at);advanceTimer=setTimeout(async()=>{if(remote!==at){busy=false;render();return}try{const next=clamp(at+1);await writeState(next);remote=next;busy=false;render()}catch(e){busy=false;$('status').textContent='Save error: '+e.message}},pacing(at));}catch(e){busy=false;$('status').textContent='Save error: '+e.message}}
function pacing(i){return PAGES[i].kind==='reward'?1800:1600}
$('studentLogin').onclick=async()=>{try{$('loginStatus').textContent='Signing in…';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message}};
$('teacherLogin').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('loginStatus').textContent=e.message}};
$('logout').onclick=()=>signOut(auth);
$('prev').onclick=()=>{preview=clamp(preview-1);render()};
$('next').onclick=()=>{preview=clamp(preview+1);render()};
$('jump').onchange=e=>{preview=clamp(Number(e.target.value));render()};
$('showStudent').onclick=async()=>{try{if(!connected)return;await writeState(preview);remote=preview;render();$('status').textContent='✓ Noah advanced to the selected mission'}catch(e){$('status').textContent='Navigation error: '+e.message}};
$('record').onclick=async()=>{if(!connected)return;notes={...notes,[preview]:{support:$('support').value,outcome:$('outcome').value}};try{await writeState(remote);render();$('status').textContent='✓ Observation saved'}catch(e){$('status').textContent='Recording error: '+e.message}};
$('export').onclick=()=>{const rows=[['mission','phase','type','task','answer','support','outcome']];PAGES.forEach((p,i)=>rows.push([i+1,p.phase,p.kind,p.student,resolveAnswer(p,answers[i])==='Waiting'?'':resolveAnswer(p,answers[i]),notes[i]?.support||'',notes[i]?.outcome||'']));const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='noah-pokemon-rescue-lesson2.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
PAGES.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+p.title;$('jump').append(o)});
onAuthStateChanged(auth,user=>{if(unsub){unsub();unsub=null}clearTimeout(advanceTimer);connected=false;busy=false;if(!user){$('login').style.display='block';$('app').style.display='none';return}
teacher=user.email==='laurademe6@gmail.com'&&user.emailVerified&&user.providerData.some(p=>p.providerId==='google.com');
if(!teacher&&!(user.uid===uid&&user.email===studentEmail)){$('loginStatus').textContent='Not authorized';signOut(auth);return}
$('login').style.display='none';$('app').style.display='block';$('role').textContent=teacher?'Laura · Teacher':'Noah · Student';$('teacherPanel').style.display=teacher?'block':'none';$('export').style.display=teacher?'inline-block':'none';render();$('status').textContent='Connecting to live progress…';
unsub=onSnapshot(ref,s=>{const d=s.exists()?s.data():{};answers=d.answers||{};notes=d.notes||{};remote=clamp(Number.isInteger(d.current)?d.current:0);connected=true;if(!teacher&&busy){$('status').textContent='✓ Live connection ready';return}render();$('status').textContent='✓ Live connection ready'},e=>{$('status').textContent='Live connection error: '+e.message;if(teacher)render()});
});
</script></body></html>
