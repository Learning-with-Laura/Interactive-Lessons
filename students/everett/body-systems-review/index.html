<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everett's Body Systems Challenge</title><style>body{font-family:system-ui;background:#edf5ff;color:#172b50;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:#243c88;color:white;padding:20px;border-radius:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#d9e7ff;color:#172b50}button:hover{filter:brightness(.95)}button.active,.primary{background:#3256d7;color:white}.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 4px 20px #20387018;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{padding:16px;background:#f3f7ff;border-radius:14px}.big{font-size:46px}.answer{display:block;width:100%;margin:8px 0;text-align:left}.good{background:#c6f5d6}.bad{background:#ffd8d8}.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.target{border:2px dashed #8ba2d9;border-radius:14px;padding:18px;min-height:75px}.pieces{display:flex;gap:8px;flex-wrap:wrap}.piece{background:#ffdf9b;touch-action:manipulation}small{color:#56647b}h2{margin-top:0}</style><main><header><h1>🧠 Everett's Body Systems Challenge!</h1><p>Grade 5 • Six systems • Study, flip, match and test yourself</p></header><nav id="nav"></nav><section id="app"></section></main><script>
const systems=[
['Digestive','🍎','Breaks food down, absorbs nutrients and removes solid waste.',[['Mouth','Chews food; saliva starts digestion'],['Esophagus','Moves food to the stomach'],['Stomach','Mixes food with digestive juices'],['Small intestine','Absorbs most nutrients'],['Liver','Makes bile to help digest fats'],['Gallbladder','Stores bile'],['Pancreas','Makes digestive juices'],['Large intestine','Absorbs remaining water and forms waste'],['Rectum','Stores waste'],['Anus','Lets waste leave the body']]],
['Circulatory','❤️','Moves blood, oxygen and nutrients around the body.',[['Heart','Pumps blood'],['Blood vessels','Carry blood around the body'],['Blood','Carries oxygen, nutrients and wastes'],['Arteries','Carry blood away from the heart'],['Veins','Carry blood toward the heart']]],
['Respiratory','🫁','Brings oxygen into the body and removes carbon dioxide.',[['Nose','Filters and warms incoming air'],['Trachea','Carries air toward the lungs'],['Lungs','Exchange oxygen and carbon dioxide'],['Diaphragm','Helps air move in and out']]],
['Nervous','🧠','Receives information and controls body responses.',[['Brain','Processes information and directs responses'],['Spinal cord','Carries messages between brain and body'],['Nerves','Carry messages throughout the body']]],
['Skeletal','🦴','Supports and protects the body and works with muscles.',[['Skull','Protects the brain'],['Rib cage','Protects heart and lungs'],['Spine','Supports the body and protects spinal cord'],['Bones','Support the body and help movement'],['Joints','Places where bones meet']]],
['Muscular','💪','Moves the body, maintains posture and helps internal organs work.',[['Muscles','Contract and relax to create movement'],['Tendons','Connect muscles to bones'],['Skeletal muscles','Move bones at joints'],['Heart muscle','Pumps blood']]]
];
let mode='Learn',sys=0,card=0,quiz=0,score=0,selected='',matched=0,questions=[],flashOrder=[];
const $=s=>document.querySelector(s);const mix=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function shuffleFlashcards(){flashOrder=mix(systems[sys][3]);card=0}
function nav(){ $('#nav').innerHTML=['Learn','Flashcards','Drag & Drop','Body Diagram','Quiz'].map(m=>'<button class="'+(mode===m?'active':'')+'" onclick="mode=\''+m+'\';if(mode===\'Flashcards\')shuffleFlashcards();render()">'+m+'</button>').join('') }
function tabs(){return '<div class="pieces">'+systems.map((s,i)=>'<button class="'+(sys===i?'active':'')+'" onclick="sys='+i+';if(mode===\'Flashcards\')shuffleFlashcards();else card=0;render()">'+s[1]+' '+s[0]+'</button>').join('')+'</div>'}
function render(){nav();let s=systems[sys],a=$('#app');if(mode==='Learn'){a.innerHTML='<div class="panel"><h2>Explore the six systems</h2>'+tabs()+'<h2>'+s[1]+' '+s[0]+' system</h2><p>'+s[2]+'</p><div class="grid">'+s[3].map(x=>'<div class="tile"><strong>'+x[0]+'</strong><p>'+x[1]+'</p></div>').join('')+'</div></div>'}
if(mode==='Flashcards'){if(!flashOrder.length)shuffleFlashcards();let x=flashOrder[card%flashOrder.length];a.innerHTML='<div class="panel"><h2>Flip cards</h2>'+tabs()+'<p>Card '+(card+1)+' of '+flashOrder.length+'</p><button class="tile" style="width:100%;min-height:180px;font-size:26px" onclick="this.innerHTML=\''+x[0].replace(/'/g,'&#39;')+'\'">'+x[1]+'<br><small>Tap to reveal the body part</small></button><p><button class="primary" onclick="card=(card+1)%flashOrder.length;render()">Next card →</button></p></div>'}
if(mode==='Drag & Drop')drawMatch();if(mode==='Body Diagram')drawDiagram();if(mode==='Quiz')drawQuiz();}

const diagramPoints=[
[['Mouth',50,15],['Esophagus',50,27],['Stomach',56,48],['Liver',42,44],['Small intestine',50,61],['Large intestine',50,69]],
[['Heart',52,38],['Arteries',40,43],['Veins',60,49],['Blood vessels',42,62]],
[['Nose',50,12],['Trachea',50,28],['Lungs',43,39],['Diaphragm',50,52]],
[['Brain',50,9],['Spinal cord',50,39],['Nerves',66,60]],
[['Skull',50,9],['Rib cage',50,40],['Spine',50,58],['Bones',35,69],['Joints',64,72]],
[['Muscles',38,44],['Tendons',35,76],['Skeletal muscles',60,65],['Heart muscle',52,38]]
];
let diagramDone=[],diagramSelected='',diagramSystem=-1;
function drawDiagram(){
if(diagramSystem!==sys){diagramSystem=sys;diagramDone=[];diagramSelected=''}
const pts=diagramPoints[sys],system=systems[sys];
const silhouette='<svg viewBox="0 0 240 420" width="100%" height="420" aria-label="Human body outline with organ illustrations"><g fill="#dce9fa" stroke="#6c88b4" stroke-width="2"><ellipse cx="120" cy="48" rx="29" ry="37"/><path d="M101 82 Q75 89 65 114 L48 217 Q45 231 57 233 Q68 232 72 217 L88 155 L91 242 L82 388 Q84 402 98 402 L119 258 L140 402 Q154 402 158 388 L149 242 L152 155 L168 217 Q172 232 183 233 Q195 231 192 217 L175 114 Q165 89 139 82 Z"/></g><g opacity=".85"><path d="M120 98 L120 145" stroke="#db8c65" stroke-width="9" stroke-linecap="round"/><path d="M112 149 Q80 121 85 165 Q89 196 113 197Z M128 149 Q160 121 155 165 Q151 196 127 197Z" fill="#e5a1a9"/><path d="M120 164 C107 153 105 172 120 181 C135 172 133 153 120 164Z" fill="#cc4b61"/><path d="M109 200 Q142 190 140 220 Q137 244 116 234 Q100 226 109 200Z" fill="#f4b174"/><path d="M101 242 Q145 226 141 280 Q97 294 101 242Z" fill="#e8c17a"/><path d="M110 243 Q133 244 110 261 Q133 265 111 281" stroke="#d68b51" stroke-width="7" fill="none"/><path d="M120 11 Q92 16 101 45 Q120 63 139 45 Q148 16 120 11Z" fill="#d3a2d7" opacity=".85"/></g></svg>';
const pins=pts.map((p,i)=>'<button class="target" style="position:absolute;left:'+p[1]+'%;top:'+p[2]+'%;transform:translate(-50%,-50%);padding:5px 8px;min-height:0;min-width:35px;background:'+(diagramDone.includes(p[0])?'#c6f5d6':'#fff')+';border:2px dashed #3256d7;z-index:2" ondragover="event.preventDefault()" ondrop="event.preventDefault();diagramPlace('+i+')" onclick="diagramPlace('+i+')">'+(diagramDone.includes(p[0])?'✓ '+p[0]:'?')+'</button>').join('');
const words=mix(pts.filter(p=>!diagramDone.includes(p[0]))).map(p=>'<button class="piece" draggable="true" ondragstart="diagramSelected=decodeURIComponent(\''+encodeURIComponent(p[0])+'\')" onclick="diagramSelected=decodeURIComponent(\''+encodeURIComponent(p[0])+'\');document.querySelectorAll(\'.piece\').forEach(b=>b.style.outline=\'\');this.style.outline=\'3px solid #3256d7\'">'+p[0]+'</button>').join('');
$('#app').innerHTML='<div class="panel"><h2>🧍 Label the Body Diagram</h2>'+tabs()+'<p>Drag each word to the correct location on the body. Or tap a word, then tap a question mark.</p><div class="pieces">'+words+'</div><div style="position:relative;width:240px;max-width:100%;margin:18px auto">'+silhouette+pins+'</div><p id="diagramFeedback">'+diagramDone.length+' of '+pts.length+' correctly labelled</p><button onclick="diagramDone=[];diagramSelected=\'\';drawDiagram()">Try again</button></div>';
}
function diagramPlace(i){if(!diagramSelected)return;let p=diagramPoints[sys][i];if(diagramSelected===p[0]){if(!diagramDone.includes(p[0]))diagramDone.push(p[0]);diagramSelected='';drawDiagram();if(diagramDone.length===diagramPoints[sys].length)document.getElementById('diagramFeedback').textContent='🎉 All correct! Try another body system.'}else document.getElementById('diagramFeedback').textContent='Not quite. Look at the body diagram and try another spot.'}

function drawMatch(){let s=systems[sys],items=s[3].slice(0,Math.min(5,s[3].length));if(!window.matchItems||window.matchSys!==sys){window.matchSys=sys;window.matchItems=mix(items);window.matchDone=[];selected=''}let a=$('#app');a.innerHTML='<div class="panel"><h2>🧩 Drag & Drop: Match the body parts</h2>'+tabs()+'<p>Drag a body part onto its function. On a phone or tablet, tap the body part and then tap the matching function.</p><div class="pieces">'+window.matchItems.map(x=>'<button draggable="true" ondragstart="selected=\''+x[0]+'\'" onclick="selected=\''+x[0]+'\';this.style.outline=\'3px solid blue\'" class="piece" '+(window.matchDone.includes(x[0])?'disabled':'')+'>'+x[0]+'</button>').join('')+'</div><div class="targets">'+items.map(x=>'<div class="target" ondragover="event.preventDefault()" ondrop="event.preventDefault();place(\''+x[0]+'\')" onclick="place(\''+x[0]+'\')"><strong>'+x[1]+'</strong><p>'+(window.matchDone.includes(x[0])?'✅ '+x[0]:'Drop here')+'</p></div>').join('')+'</div><p id="feedback">'+window.matchDone.length+' of '+items.length+' matched</p><button onclick="selected=\'\';window.matchItems=null;render()">Restart matching</button></div>'}
function place(name){if(!selected)return;if(selected===name){if(!window.matchDone.includes(name))window.matchDone.push(name);selected='';drawMatch();if(window.matchDone.length===Math.min(5,systems[sys][3].length))$('#feedback').textContent='🎉 Perfect match! Try another body system.'}else $('#feedback').textContent='Not quite. Try another function!'}
const challengeBank=[["Digestive","After swallowing a bite of apple, which structure carries it to the stomach?","Esophagus",["Small intestine","Large intestine","Liver"]],["Digestive","Which organ churns food and mixes it with digestive juices?","Stomach",["Liver","Esophagus","Large intestine"]],["Digestive","Where do most nutrients from digested food enter the bloodstream?","Small intestine",["Stomach","Large intestine","Esophagus"]],["Digestive","Which organ absorbs much of the remaining water from undigested food?","Large intestine",["Small intestine","Stomach","Liver"]],["Digestive","Which organ produces bile to help digest fats?","Liver",["Stomach","Pancreas","Esophagus"]],["Digestive","What is the main job of the teeth during digestion?","Break food into smaller pieces",["Absorb nutrients into blood","Carry food to the stomach","Make bile"]],["Digestive","Why is saliva useful when you chew?","It moistens food and begins digestion",["It pumps blood","It absorbs most nutrients","It moves oxygen into lungs"]],["Digestive","What happens to food before it reaches the esophagus?","It is chewed and swallowed",["It enters the large intestine","It passes through the liver","It enters the bloodstream"]],["Circulatory","During a run, which organ beats faster to move blood around your body?","Heart",["Lungs","Brain","Stomach"]],["Circulatory","Which blood vessels usually carry blood away from the heart?","Arteries",["Veins","Capillaries","Nerves"]],["Circulatory","Which blood vessels usually return blood to the heart?","Veins",["Arteries","Airways","Tendons"]],["Circulatory","What do tiny capillaries help exchange with body cells?","Oxygen, nutrients and wastes",["Bones and muscles","Food and saliva","Thoughts and signals"]],["Circulatory","Why does your heart rate increase when you exercise?","Muscles need more oxygen and nutrients",["Bones need to become longer","Your stomach stops digestion","Your skull needs more blood"]],["Circulatory","Which component of blood carries most oxygen?","Red blood cells",["Platelets","Plasma alone","White blood cells"]],["Circulatory","What helps blood form a clot after a small cut?","Platelets",["Nerves","Ligaments","Air sacs"]],["Circulatory","How do the circulatory and respiratory systems work together?","Blood carries oxygen taken in by the lungs",["The heart chews food","Bones pump air","The stomach sends nerve signals"]],["Respiratory","What happens to the diaphragm when you breathe in?","It contracts and moves downward",["It relaxes and moves upward","It stops the heart","It closes the lungs"]],["Respiratory","Which tube carries air toward the lungs?","Trachea",["Esophagus","Spinal cord","Aorta"]],["Respiratory","Where does oxygen pass from air into the blood?","Alveoli in the lungs",["Stomach lining","Large intestine","Bones"]],["Respiratory","What gas does your body mainly remove when you breathe out?","Carbon dioxide",["Oxygen only","Nitrogen only","Hydrogen"]],["Respiratory","Why do you breathe faster during exercise?","Your cells need more oxygen and release more carbon dioxide",["Your stomach needs more food","Your bones make more blood","Your brain stops working"]],["Respiratory","What protects your lungs inside your chest?","Rib cage",["Pelvis","Skull","Kneecap"]],["Respiratory","Which path does air follow when you inhale?","Nose or mouth, trachea, lungs",["Mouth, esophagus, stomach","Nose, stomach, lungs","Lungs, intestine, heart"]],["Respiratory","What happens when the diaphragm relaxes during normal breathing out?","It moves upward as air leaves the lungs",["It moves downward to pull in air","It pumps blood","It digests food"]],["Nervous","You touch a hot pan and quickly pull your hand away. Which system sends the signals?","Nervous system",["Digestive system","Skeletal system","Respiratory system"]],["Nervous","Which organ processes information and helps you make decisions?","Brain",["Heart","Stomach","Liver"]],["Nervous","Which structure carries messages between the brain and many body parts?","Spinal cord",["Esophagus","Trachea","Large intestine"]],["Nervous","What do nerves carry throughout the body?","Electrical messages",["Digested food","Air bubbles","Bone marrow"]],["Nervous","How do your eyes and brain work together when you read?","Eyes detect information and the brain interprets it",["Eyes digest the words","Brain pumps light through blood","Bones interpret letters"]],["Nervous","Why can you feel a mosquito landing on your arm?","Sensory nerves send information to the brain",["Veins send food to the stomach","Muscles make oxygen","Bones send air"]],["Nervous","Which part of the nervous system is protected by the skull?","Brain",["Spinal cord","Peripheral nerves","Heart"]],["Nervous","How does the nervous system help you catch a ball?","It processes what you see and directs muscle movement",["It turns food into energy by itself","It pumps blood with the lungs","It builds bones instantly"]],["Skeletal","Which bones protect your brain?","Skull",["Ribs","Femur","Pelvis"]],["Skeletal","Which bones help protect your heart and lungs?","Ribs",["Finger bones","Jawbone","Kneecaps"]],["Skeletal","Where do two bones meet and allow movement?","Joint",["Tendon","Nerve","Artery"]],["Skeletal","What is one important job of your skeleton besides protection?","Supporting the body",["Digesting proteins","Pumping blood","Taking in oxygen"]],["Skeletal","Which bone is in your upper leg?","Femur",["Humerus","Radius","Ulna"]],["Skeletal","What helps keep bones connected at a joint?","Ligaments",["Tendons","Veins","Alveoli"]],["Skeletal","Why do bones and muscles need to work together?","Muscles pull on bones to produce movement",["Bones pump air into muscles","Muscles turn bones into blood","Bones digest food"]],["Skeletal","What is the backbone made of?","A series of vertebrae",["One solid bone","Only cartilage","A chain of tendons"]],["Muscular","What do muscles do to move a bone?","Contract and pull",["Push by growing longer","Pump air into the bone","Turn into ligaments"]],["Muscular","What connects a muscle to a bone?","Tendon",["Ligament","Nerve cell","Capillary"]],["Muscular","When you bend your elbow, what happens to your biceps muscle?","It contracts",["It becomes a bone","It fills with air","It stops receiving blood"]],["Muscular","Which type of muscle works without you thinking about it to pump blood?","Cardiac muscle",["Skeletal muscle","Biceps muscle","Calf muscle"]],["Muscular","Why do muscles need oxygen when you run?","To release energy for movement",["To create teeth","To make the skull flexible","To replace the spinal cord"]],["Muscular","Which muscles help you smile?","Facial muscles",["Heart muscle","Stomach muscle","Diaphragm only"]],["Muscular","Which two systems work directly together when you jump?","Muscular and skeletal",["Digestive and respiratory only","Nervous and digestive only","Circulatory and digestive only"]],["Muscular","What usually happens when one muscle in a bending pair contracts?","Its partner relaxes",["Both bones disappear","Both muscles become tendons","The joint becomes fixed forever"]]];
let missedQuestions=[];
function startQuiz(){let picks=[];for(let i=0;i<6;i++)picks.push(...mix(challengeBank.filter(q=>q[0]===systems[i][0])).slice(0,4));questions=mix(picks);quiz=0;score=0;missedQuestions=[];showQuestion()}
function drawQuiz(){if(!questions.length){$('#app').innerHTML='<div class="panel"><h2>🏆 New Challenge Quiz</h2><p>24 new questions from all six body systems. Apply what you know to real situations. Every attempt draws a different selection from a larger question bank.</p><button class="primary" onclick="startQuiz()">Start new challenge</button></div>'}else showQuestion()}
function showQuestion(){if(quiz>=questions.length){let review=missedQuestions.length?'<h3>🎯 What to study next</h3>'+missedQuestions.map(q=>'<div style="padding:12px;margin:8px 0;background:#eef3ff;border-radius:10px"><strong>'+q[0]+'</strong><p>'+q[1]+'</p><p>Your answer: '+q[4]+'</p><p><strong>Correct answer: '+q[2]+'</strong></p></div>').join('')+'<p>Review these topics in Learn and Flashcards, then try again.</p>':'<p>🎉 Outstanding! You answered every question correctly. Try again for a different set of questions.</p>';$('#app').innerHTML='<div class="panel"><h2>🏆 Challenge complete!</h2><h1>'+score+' / '+questions.length+'</h1>'+review+'<button class="primary" onclick="startQuiz()">Try a different quiz</button></div>';return}let q=questions[quiz],opts=mix([q[2],...q[3]]);$('#app').innerHTML='<div class="panel"><p>Question '+(quiz+1)+' / '+questions.length+' • '+q[0]+'</p><h2>'+q[1]+'</h2>'+opts.map(x=>'<button class="answer" onclick="respond(this,'+(x===q[2])+')">'+x+'</button>').join('')+'<p id="feedback"></p><button id="next" class="primary" hidden onclick="quiz++;showQuestion()">Next →</button></div>'}
function respond(el,ok){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);el.classList.add(ok?'good':'bad');if(ok)score++;else missedQuestions.push([...questions[quiz],el.textContent]);$('#feedback').textContent=(ok?'✅ Correct! ':'💡 Remember: ')+questions[quiz][2];$('#next').hidden=false}
render();
</script></html>
