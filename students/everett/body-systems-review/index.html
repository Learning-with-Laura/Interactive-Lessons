<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everett's Body Systems Challenge</title><style>body{font-family:system-ui;background:#edf5ff;color:#172b50;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:#243c88;color:white;padding:20px;border-radius:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#d9e7ff;color:#172b50}button:hover{filter:brightness(.95)}button.active,.primary{background:#3256d7;color:white}.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 4px 20px #20387018;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{padding:16px;background:#f3f7ff;border-radius:14px}.big{font-size:46px}.answer{display:block;width:100%;margin:8px 0;text-align:left}.good{background:#c6f5d6}.bad{background:#ffd8d8}.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.target{border:2px dashed #8ba2d9;border-radius:14px;padding:18px;min-height:75px}.pieces{display:flex;gap:8px;flex-wrap:wrap}.piece{background:#ffdf9b;touch-action:manipulation}small{color:#56647b}h2{margin-top:0}</style><main><header><h1>🧠 Everett's Body Systems Challenge!</h1><p>Grade 5 • Six systems • Study, flip, match and test yourself</p></header><nav id="nav"></nav><section id="app"></section></main><script>
const systems=[
['Digestive','🍎','Breaks food down, absorbs nutrients and removes solid waste.',[['Mouth','Chews food; saliva starts digestion'],['Esophagus','Moves food to the stomach'],['Stomach','Mixes food with digestive juices'],['Small intestine','Absorbs most nutrients'],['Liver','Makes bile to help digest fats'],['Gallbladder','Stores bile'],['Pancreas','Makes digestive juices'],['Large intestine','Absorbs remaining water and forms waste'],['Rectum','Stores waste'],['Anus','Lets waste leave the body']]],
['Circulatory','❤️','Moves blood, oxygen and nutrients around the body.',[['Heart','Pumps blood'],['Blood vessels','Carry blood around the body'],['Blood','Carries oxygen, nutrients and wastes'],['Arteries','Carry blood away from the heart'],['Veins','Carry blood toward the heart']]],
['Respiratory','🫁','Brings oxygen into the body and removes carbon dioxide.',[['Nose','Filters and warms incoming air'],['Trachea','Carries air toward the lungs'],['Lungs','Exchange oxygen and carbon dioxide'],['Diaphragm','Helps air move in and out']]],
['Nervous','🧠','Receives information and controls body responses.',[['Brain','Processes information and directs responses'],['Spinal cord','Carries messages between brain and body'],['Nerves','Carry messages throughout the body']]],
['Skeletal','🦴','Supports and protects the body and works with muscles.',[['Skull','Protects the brain'],['Rib cage','Protects heart and lungs'],['Spine','Supports the body and protects spinal cord'],['Bones','Support the body and help movement'],['Joints','Places where bones meet']]],
['Muscular','💪','Moves the body, maintains posture and helps internal organs work.',[['Muscles','Contract and relax to create movement'],['Tendons','Connect muscles to bones'],['Skeletal muscles','Move bones at joints'],['Heart muscle','Pumps blood']]]
];
let mode='Learn',sys=0,card=0,quiz=0,score=0,selected='',matched=0,questions=[];
const $=s=>document.querySelector(s);const mix=a=>[...a].sort(()=>Math.random()-.5);
function nav(){ $('#nav').innerHTML=['Learn','Flashcards','Drag & Drop','Quiz'].map(m=>'<button class="'+(mode===m?'active':'')+'" onclick="mode=\''+m+'\';render()">'+m+'</button>').join('') }
function tabs(){return '<div class="pieces">'+systems.map((s,i)=>'<button class="'+(sys===i?'active':'')+'" onclick="sys='+i+';card=0;render()">'+s[1]+' '+s[0]+'</button>').join('')+'</div>'}
function render(){nav();let s=systems[sys],a=$('#app');if(mode==='Learn'){a.innerHTML='<div class="panel"><h2>Explore the six systems</h2>'+tabs()+'<h2>'+s[1]+' '+s[0]+' system</h2><p>'+s[2]+'</p><div class="grid">'+s[3].map(x=>'<div class="tile"><strong>'+x[0]+'</strong><p>'+x[1]+'</p></div>').join('')+'</div></div>'}
if(mode==='Flashcards'){let x=s[3][card%s[3].length];a.innerHTML='<div class="panel"><h2>Flip cards</h2>'+tabs()+'<p>Card '+(card+1)+' of '+s[3].length+'</p><button class="tile" style="width:100%;min-height:180px;font-size:26px" onclick="this.innerHTML=\''+x[0].replace(/'/g,'&#39;')+'\'">'+x[1]+'<br><small>Tap to reveal the body part</small></button><p><button class="primary" onclick="card=(card+1)%systems[sys][3].length;render()">Next card →</button></p></div>'}
if(mode==='Drag & Drop')drawMatch();if(mode==='Quiz')drawQuiz();}
function drawMatch(){let s=systems[sys],items=s[3].slice(0,Math.min(5,s[3].length));if(!window.matchItems||window.matchSys!==sys){window.matchSys=sys;window.matchItems=mix(items);window.matchDone=[];selected=''}let a=$('#app');a.innerHTML='<div class="panel"><h2>🧩 Drag & Drop: Match the body parts</h2>'+tabs()+'<p>Drag a body part onto its function. On a phone or tablet, tap the body part and then tap the matching function.</p><div class="pieces">'+window.matchItems.map(x=>'<button draggable="true" ondragstart="selected=\''+x[0]+'\'" onclick="selected=\''+x[0]+'\';this.style.outline=\'3px solid blue\'" class="piece" '+(window.matchDone.includes(x[0])?'disabled':'')+'>'+x[0]+'</button>').join('')+'</div><div class="targets">'+items.map(x=>'<div class="target" ondragover="event.preventDefault()" ondrop="event.preventDefault();place(\''+x[0]+'\')" onclick="place(\''+x[0]+'\')"><strong>'+x[1]+'</strong><p>'+(window.matchDone.includes(x[0])?'✅ '+x[0]:'Drop here')+'</p></div>').join('')+'</div><p id="feedback">'+window.matchDone.length+' of '+items.length+' matched</p><button onclick="selected=\'\';window.matchItems=null;render()">Restart matching</button></div>'}
function place(name){if(!selected)return;if(selected===name){if(!window.matchDone.includes(name))window.matchDone.push(name);selected='';drawMatch();if(window.matchDone.length===Math.min(5,systems[sys][3].length))$('#feedback').textContent='🎉 Perfect match! Try another body system.'}else $('#feedback').textContent='Not quite. Try another function!'}
function startQuiz(){let all=systems.flatMap(s=>s[3].map(x=>({system:s[0],term:x[0],answer:x[1]})));questions=mix(all).slice(0,24);quiz=0;score=0;showQuestion()}
function drawQuiz(){if(!questions.length){$('#app').innerHTML='<div class="panel"><h2>🏆 Final Practice Test</h2><p>24 questions from all six body systems. Choose the correct function for each body part.</p><button class="primary" onclick="startQuiz()">Start test</button></div>'}else showQuestion()}
function showQuestion(){if(quiz>=questions.length){$('#app').innerHTML='<div class="panel"><h2>🏆 Finished!</h2><h1>'+score+' / '+questions.length+'</h1><p>Review any systems you found tricky, then try again.</p><button class="primary" onclick="startQuiz()">Try again</button></div>';return}let q=questions[quiz],wrong=mix(systems.flatMap(s=>s[3].map(x=>x[1])).filter(x=>x!==q.answer)).slice(0,3);let opts=mix([q.answer,...wrong]);$('#app').innerHTML='<div class="panel"><p>Question '+(quiz+1)+' / '+questions.length+' • '+q.system+'</p><h2>What does the '+q.term.toLowerCase()+' do?</h2>'+opts.map(x=>'<button class="answer" onclick="respond(this,'+(x===q.answer)+')">'+x+'</button>').join('')+'<p id="feedback"></p><button id="next" class="primary" hidden onclick="quiz++;showQuestion()">Next →</button></div>'}
function respond(el,ok){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);el.classList.add(ok?'good':'bad');if(ok)score++;$('#feedback').textContent=(ok?'✅ Correct! ':'💡 Remember: ')+questions[quiz].answer;$('#next').hidden=false}
render();
</script></html>
