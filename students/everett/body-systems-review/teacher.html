<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everett Body Systems | Teacher</title><style>body{font:16px system-ui;background:#eef3ff;color:#172b50;margin:0}main{max-width:900px;margin:30px auto;padding:20px}.panel{background:white;padding:22px;border-radius:16px;margin:12px 0}button{padding:12px;border:0;border-radius:9px;background:#3256d7;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}small{color:#65738b}.bad{background:#fff0ef}</style><main><h1>Everett | Body Systems Teacher Dashboard</h1><div id="login" class="panel"><p>Sign in with Laura's Google account to monitor Everett.</p><button id="signin">Sign in with Google</button><p id="authStatus"></p></div><div id="dashboard" style="display:none"><div class="panel"><h2>Live responses</h2><p id="status">Waiting for Everett's answers…</p><button id="export">Download CSV</button></div><div id="results" class="panel">No answers received yet.</div></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyC7y-jx-LMOJyjtbLHuChc3yEGZXlQrtZ8',authDomain:'live-learning-with-laura.firebaseapp.com',projectId:'live-learning-with-laura',appId:'1:846701984036:web:0447c64aef753c1c1e1bb1'});
const auth=getAuth(app),db=getFirestore(app);let answers=[];
const safe=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.getElementById('signin').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>document.getElementById('authStatus').textContent=e.message);
onAuthStateChanged(auth,u=>{let ok=u?.email==='laurademe6@gmail.com'&&u?.emailVerified&&u?.providerData?.some(p=>p.providerId==='google.com');document.getElementById('login').style.display=ok?'none':'block';document.getElementById('dashboard').style.display=ok?'block':'none';if(!ok){document.getElementById('authStatus').textContent=u?'Please sign in with Laura’s authorised Google account.':'';return}onSnapshot(doc(db,'lessonAnswers','everett_body_systems_20261104'),snap=>{if(!snap.exists()){document.getElementById('status').textContent='Waiting for Everett to answer a quiz question.';return}const d=snap.data();answers=Object.values(d.answers||{}).sort((a,b)=>a.number-b.number);document.getElementById('status').textContent=answers.length+' quiz answers received. Last updated: '+(d.lastUpdated?.toDate?.().toLocaleString()||'just now');document.getElementById('results').innerHTML='<table><thead><tr><th>#</th><th>System / question</th><th>Everett selected</th><th>Correct answer</th><th>Result</th></tr></thead><tbody>'+answers.map(a=>'<tr class="'+(a.correct?'':'bad')+'"><td>'+safe(a.number)+'</td><td>'+safe(a.system)+'<br><small>'+safe(a.question)+'</small></td><td>'+safe(a.selected)+'</td><td>'+safe(a.correctAnswer)+'</td><td>'+(a.correct?'✓':'Review')+'</td></tr>').join('')+'</tbody></table>'},e=>document.getElementById('status').textContent='Firestore access error: '+e.message)});
document.getElementById('export').onclick=()=>{const rows=[['Number','System','Question','Selected','Correct answer','Correct'],...answers.map(a=>[a.number,a.system,a.question,a.selected,a.correctAnswer,a.correct])];const csv=rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Everett-Body-Systems-Responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
