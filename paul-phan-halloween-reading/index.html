{"title":"🕯️ Mission 9: The Lantern in the Window","story":"Nora and Ben walked past an old house. A yellow lantern glowed in the window. Ben thought the house was empty, but Nora saw fresh footprints on the path. They knocked on the door. An older woman opened it and smiled. She had placed the lantern there so children could find the Halloween party.","qs":[["What colour was the lantern?",["Red","Yellow","Blue"],1],["Why did Ben think the house was empty?",["He thought no one lived there","He heard loud music","He saw a dog"],0],["What clue suggested someone was there?",["Fresh footprints","A broken gate","A dark sky"],0],["Why was the lantern in the window?",["To guide children to a party","To scare birds","To light the garden"],0],["What is the best title?",["A Lost Cat","The Helpful Lantern","The Broken Window"],1]]},
