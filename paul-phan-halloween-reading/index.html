<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paul's Halloween Reading Adventure | Learning with Laura</title><style>
*{box-sizing:border-box}body{margin:0;font:20px system-ui,sans-serif;color:#30204b;background:linear-gradient(140deg,#fff0d4,#f2e6ff)}header{background:#572b82;color:white;padding:24px;text-align:center}h1{margin:0;font-size:clamp(27px,5vw,44px)}main{max-width:850px;margin:24px auto;padding:0 15px}.card{background:white;border-radius:25px;padding:28px;box-shadow:0 10px 30px #3b225322}button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid #d8c6ef;padding:14px;background:#f9f4ff;color:#30204b}button:focus-visible{outline:4px solid orange}.choices{display:grid;gap:12px}.choice{text-align:left}.selected{background:#c9f4e0;border-color:#16804f}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.primary{background:#6a3ab2;color:white}progress{width:min(600px,90%);height:22px;accent-color:#ffba36}.story{background:#fff5df;padding:20px;border-radius:15px;line-height:1.65}h2{font-size:1.55rem}.chip{display:inline-block;background:#f3e8ff;padding:9px;border-radius:12px;margin:5px}.drag{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.drag button{background:#ffe5b2}.muted{font-size:15px;color:#655776}input{font:inherit;width:100%;padding:12px;border:2px solid #bba6dc;border-radius:12px}#feedback{min-height:35px;font-weight:700;color:#4b2877}@media(max-width:600px){.card{padding:18px}body{font-size:18px}}</style>
<header><h1>🎃 Paul's Halloween Reading Adventure</h1><p>👋 Welcome Paul! Eight spooky-fun missions await!</p><progress id="progress" value="1" max="8"></progress><div id="step"></div></header><main><section class="card"><h2 id="title"></h2><div id="body"></div><p id="feedback" aria-live="polite"></p><div class="nav"><button id="back">← Back</button><button class="primary" id="next">Next →</button></div></section><p class="muted">Learning with Laura • Lesson preview only. No sign-in, cloud saving or teacher monitoring is enabled. Do not enter personal information.</p></main>
<script>
const missions=[
{title:"🎃 Mission 1: Pumpkin Check-In",story:"Tonight, you are a Halloween detective! First, choose how you feel.",qs:[["How are you feeling today?",["😄 Excited","🙂 Good","😴 Tired","🤔 Unsure"]],["Which Halloween helper would you choose?",["🦇 Bat","🐈‍⬛ Cat","👻 Ghost","🕷️ Spider"]]]},
{title:"🦇 Mission 2: The Missing Pumpkin",story:"Mia put a small orange pumpkin on her front step. She wanted to carve a smiling face after lunch. When Mia came back, the pumpkin was gone! She saw tiny muddy footprints near the garden. Then she heard a soft squeak. Her little brother Leo was behind a bush. He had moved the pumpkin to keep it safe from the rain. Mia laughed and thanked him.",qs:[["Where did Mia put the pumpkin?",["In the kitchen","On the front step","In the garden"],1],["What clue did Mia notice?",["Muddy footprints","A broken window","A red ribbon"],0],["Why did Leo move the pumpkin?",["He wanted to hide it forever","He wanted to paint it","He wanted to keep it dry"],2],["How did Mia feel at the end?",["Happy","Angry","Afraid"],0]]},
{title:"👻 Mission 3: Ghostly Story Detective",story:"A friendly ghost named Pip lived in an old library. Every night, Pip sorted books on the shelves. One windy evening, a window blew open and pages flew everywhere. Pip closed the window and asked Owl to help. Together they put every book back. By morning, the library was tidy again.",qs:[["Where does Pip live?",["A library","A castle","A cave"],0],["What caused the problem?",["A cat","An open window and wind","A broken shelf"],1],["Who helped Pip?",["A witch","A pumpkin","Owl"],2],["What is the best lesson?",["Helping each other solves problems","Books should stay outside","Wind is always bad"],0]]},
{title:"🧙 Mission 4: The Mixed-Up Spell",story:"Wanda the witch wanted to make pumpkin soup. Read the events, then tap them in the order they happened.",order:["Wanda washed the pumpkin.","She cut the pumpkin into pieces.","She cooked the pieces in a pot.","She shared the soup with her friends."]},
{title:"🕸️ Mission 5: Spider's Word Web",story:"A spider made a gigantic web across the gate. Ben was cautious, so he walked slowly around it. At last, he reached the brightly lit house.",qs:[["Gigantic means...",["Very small","Very big","Very quiet"],1],["Cautious means...",["Careful","Sleepy","Silly"],0],["Which clue helps you understand cautious?",["Walked slowly","Brightly lit","Across the gate"],0],["Which word describes the house?",["Broken","Brightly lit","Empty"],1]]},
{title:"🍬 Mission 6: The Haunted Candy Shop",story:"The shopkeeper gave these directions: First choose a pumpkin bag. Next collect two chocolate treats. Last pick one fruit treat.",order:["Choose a pumpkin bag","Collect two chocolate treats","Pick one fruit treat"],qs:[["How many chocolate treats do you collect?",["One","Two","Three"],1],["What happens last?",["Pick a fruit treat","Choose a bag","Close the shop"],0]]},
{title:"🔮 Mission 7: The Halloween Mystery",story:"Sam heard a scratching sound by the door. He saw a small shadow with pointy ears. A bowl of milk was empty. Then he heard a quiet meow.",qs:[["What is most likely outside?",["A cat","A dragon","A robot"],0],["Which clue best supports your answer?",["A meow","A shadow","A door"],0],["What should Sam do first?",["Run away","Look carefully and ask an adult for help","Shout at the animal"],1]],short:"Write one word that describes Sam's visitor."},
{title:"🏆 Mission 8: Monster Mission Finale",story:"You solved the Halloween mysteries! Celebrate your reading detective skills.",qs:[["What helped you understand the stories?",["Looking for clues","Guessing without reading","Skipping every sentence"],0],["Which mission did you like most?",["Pumpkin mystery","Ghost detective","Mixed-up spell","Halloween mystery"]],["How proud do you feel?",["🌟 Very proud","🙂 Proud","💪 Still practising"]]]}
];let page=0,answers={},sequence=[];const el=id=>document.getElementById(id);function key(q){return page+":"+q}function render(){const m=missions[page];el("title").textContent=m.title;el("step").textContent="Mission "+(page+1)+" of "+missions.length;el("progress").value=page+1;el("feedback").textContent="";el("back").disabled=page===0;el("next").textContent=page===7?"Finish 🏆":"Next →";const b=el("body");b.replaceChildren();const story=document.createElement("p");story.className="story";story.textContent=m.story;b.append(story);if(m.order){sequence=answers[key("order")]||[];const info=document.createElement("p");info.textContent="Tap each event in the correct order. You can reset and try again!";b.append(info);const pool=document.createElement("div");pool.className="drag";const chosen=document.createElement("div");chosen.className="drag";const shuffled=m.order.map((_,i)=>i).sort((a,b)=>((a*3+1)%m.order.length)-((b*3+1)%m.order.length));function draw(){pool.replaceChildren();chosen.replaceChildren();shuffled.filter(i=>!sequence.includes(i)).forEach(i=>{const btn=document.createElement("button");btn.textContent=m.order[i];btn.onclick=()=>{sequence.push(i);answers[key("order")]=[...sequence];draw()};pool.append(btn)});sequence.forEach((i,n)=>{const chip=document.createElement("button");chip.textContent=(n+1)+". "+m.order[i];chip.onclick=()=>{sequence.splice(n,1);answers[key("order")]=[...sequence];draw()};chosen.append(chip)});if(sequence.length===m.order.length)el("feedback").textContent=sequence.every((x,i)=>x===i)?"🌟 Perfect order!":"Good try! Tap a step to move it and try again."}b.append(pool,chosen);const reset=document.createElement("button");reset.textContent="↻ Start over";reset.onclick=()=>{sequence=[];answers[key("order")]=[];draw()};b.append(reset);draw()}(m.qs||[]).forEach((q,qi)=>{const h=document.createElement("h3");h.textContent=q[0];b.append(h);const choices=document.createElement("div");choices.className="choices";q[1].forEach((option,i)=>{const btn=document.createElement("button");btn.className="choice"+(answers[key(qi)]===i?" selected":"");btn.textContent=option;btn.onclick=()=>{answers[key(qi)]=i;choices.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));btn.classList.add("selected");el("feedback").textContent=q.length>2?(i===q[2]?"🌟 Great detective work!":"🔎 Good try. Read the clue again! "):"✨ Nice choice, Paul!"};choices.append(btn)});b.append(choices)});if(m.short){const h=document.createElement("h3");h.textContent=m.short;const inp=document.createElement("input");inp.maxLength=35;inp.placeholder="One word is enough!";inp.value=answers[key("short")]||"";inp.oninput=()=>answers[key("short")]=inp.value;b.append(h,inp)}}el("back").onclick=()=>{if(page>0){page--;render();window.scrollTo(0,0)}};el("next").onclick=()=>{if(page<7){page++;render();window.scrollTo(0,0)}else{el("feedback").textContent="🎉 Amazing work, Paul! You finished your Halloween reading adventure!"}};render();
</script></html>
