<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leen's Halloween Reading Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fce9b8,#e5dcff);color:#34244b;font:20px system-ui}header{background:#56318d;color:white;text-align:center;padding:22px}main{max-width:830px;margin:22px auto;padding:0 14px}.card{background:white;padding:25px;border-radius:23px;box-shadow:0 8px 25px #49337020}button,input{font:inherit;border-radius:14px;padding:13px;border:2px solid #cbb9e3}button{cursor:pointer;background:#f6efff;color:#33204f}button:focus-visible{outline:4px solid orange}.option{display:block;width:100%;text-align:left;margin:12px 0}.chosen{background:#c9f2d8;border-color:#228652}.nav{display:flex;justify-content:space-between;margin-top:25px}.primary{background:#663aa4;color:white}.scene{font-size:70px;text-align:center;background:#f4edff;border-radius:18px;padding:12px}.story{background:#fff5df;padding:18px;border-radius:15px;line-height:1.7}progress{width:90%;height:22px;accent-color:#ffb72c}small{display:block;margin:14px 0}#login{max-width:550px;margin:30px auto}label{display:block;margin:12px 0}input{width:100%}</style><section id="login" class="card"><h2>🎃 Welcome, Leen!</h2><label>Username<input id="username" value="LeenY" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="sign" class="primary">Start my adventure</button><p id="loginStatus" role="status"></p></section><div id="app" hidden><header><h1>🎃 Leen's Halloween Reading Adventure</h1><progress id="progress" value="1" max="15"></progress><div id="count"></div></header><main><section class="card"><div id="scene" class="scene"></div><h2 id="title"></h2><p class="story" id="story"></p><div id="questions"></div><p id="feedback" aria-live="polite"></p><div class="nav"><button id="back">← Back</button><button id="next" class="primary">Next mission →</button></div></section><small id="cloud">Connecting…</small></main></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getFirestore,doc,onSnapshot,setDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";const firebase=initializeApp({apiKey:"AIzaSyC7y-jx-LMOJyjtbLHuChc3yEGZXlQrtZ8",authDomain:"live-learning-with-laura.firebaseapp.com",projectId:"live-learning-with-laura",appId:"1:846701984036:web:0447c64aef753c1c1e1bb1"}),auth=getAuth(firebase),db=getFirestore(firebase),uid="x5zZk9UozVY6ESWu79ckw3lucv33",ref=doc(db,"lessonAnswers","leen_halloween_20261029"),content=doc(db,"lessonQuestions","leen_halloween_20261029"),base=[["🎃 Pumpkin Welcome","The friendly pumpkin says, 'You can do hard things! We will read one word at a time.'",[["How do you feel?",["😊 Ready","🙂 A little unsure","😴 Tired"]],["Choose your helper!",["👻 Ghost","🐈‍⬛ Cat","🦇 Bat"]]]],["👻 Ghost's Short Vowels","Pip the ghost finds a pin, a pen, and a pot. Say each word slowly.",[["Which word has the short i sound?",["pin","pen","pot"],0],["Which word has the short e sound?",["pin","pen","pot"],1],["Which word has the short o sound?",["pin","pen","pot"],2]]],["🕯️ Light the Lantern","A vowel team is two letters working together to make a sound. Sometimes two vowels say one long sound.",[["Tap the word with ai.",["rain","run","red"],0],["Tap the word with ee.",["see","sit","sun"],0],["Tap the word with oa.",["boat","bat","bit"],0]]],["🧙 Witch's AI Cauldron","The witch hears rain on her roof. The train is late. She puts paint on a pumpkin.",[["Find the word with ai.",["rain","ran","run"],0],["Find another ai word.",["train","tree","trip"],0],["Which word rhymes with rain?",["pain","pin","pen"],0]]],["🍬 Candy Trail AY","At the end of a word, the long a sound can be spelled ay. Say day, play and stay.",[["Find the ay word.",["day","dig","dog"],0],["Which word has ay?",["play","plan","plug"],0],["Finish: We can ___!",["play","pin","pot"],0]]],["🦇 Bat's EE Tree","Benny the bat can see three bees by the tree.",[["Which word has ee?",["tree","try","trap"],0],["Which word says the long e sound?",["see","sit","set"],0],["Complete: I can ___ a bat.",["see","sat","set"],0]]],["🐈‍⬛ Cat's EA Treat","A black cat finds a leaf. It eats a treat near the beach.",[["Find the ea word.",["leaf","lip","log"],0],["Which word has the long e sound?",["beach","bench","back"],0],["Find another ea word.",["eat","it","at"],0]]],["🚣 Boat on the Moat","A small goat rides in a boat. It floats near a spooky castle.",[["Which word has oa?",["goat","got","get"],0],["What rhymes with boat?",["coat","cat","cut"],0],["Which word says long o?",["road","red","rid"],0]]],["❄️ Snowy Ghost OW","A ghost sees snow outside the window. Some words use ow to say long o.",[["Which word has the long o sound?",["snow","now","cow"],0],["Find another long o word.",["grow","brown","how"],0],["Which word has ow?",["slow","slip","slam"],0]]],["🕸️ Spider's Word Sort","Help the spider find the vowel team in each word.",[["rain belongs with…",["ai","ee","oa"],0],["play belongs with…",["ay","ea","ow"],0],["boat belongs with…",["oa","ai","ee"],0],["tree belongs with…",["ee","ay","ow"],0]]],["🔮 Magic Word Match","Read the word. Picture it in your mind. Choose its meaning.",[["Which word means water falling from clouds?",["rain","train","paint"],0],["Which word is something you can ride on water?",["boat","coat","goat"],0],["Which word is something with branches and leaves?",["tree","three","see"],0]]],["🏚️ The Friendly Ghost's Story","Pip is a kind ghost. One day, Pip sees rain. A little goat is wet. Pip finds a coat. The goat is warm. Then Pip and the goat play by a tree.",[["Who sees the rain?",["Pip","A witch","A bat"],0],["Who is wet?",["A goat","A cat","A spider"],0],["What does Pip find?",["A coat","A boat","A cake"],0],["Where do they play?",["By a tree","In a cave","On a train"],0]]],["🗝️ Find the Secret Key","The key is near a green tree. A goat stands by the tree. The goat says, 'Look in the leaves!' Pip sees the key.",[["Where is the key?",["Near a tree","In a boat","On a train"],0],["Who gives Pip a clue?",["The goat","The bat","The cat"],0],["Which word has ee?",["green","goat","great"],0]]],["🎁 Treasure Chest","You found the treasure! Every time you sound out a word, your reading grows.",[["Which word was easiest to read?",["rain","tree","boat","play"]],["Which vowel team would you like to practise again?",["ai / ay","ee / ea","oa / ow"]],["How proud do you feel?",["🌟 Very proud","💪 I kept trying","🙂 Ready to practise more"]]]],["🌟 Bonus: Trickier Words","Try these only if you feel ready. Take your time.",[["Which word has ea?",["dream","drum","drop"],0],["Which word has ai?",["paint","plant","print"],0],["Which word has oa?",["float","flat","flit"],0]]]];let missions=structuredClone(base),answers={},page=0,ready=false,timer,stopAnswers,stopContent;const $=id=>document.getElementById(id);$("sign").onclick=async()=>{if($("username").value.trim().toLowerCase()!=="leeny"){$("loginStatus").textContent="Please enter LeenY.";return}try{await signInWithEmailAndPassword(auth,"leeny@students.learningwithlaura.invalid",$("password").value)}catch(e){$("loginStatus").textContent="Could not sign in. Please check the password."}};onAuthStateChanged(auth,user=>{stopAnswers?.();stopContent?.();if(!user||user.uid!==uid){$("login").hidden=false;$("app").hidden=true;if(user)signOut(auth);return}$("login").hidden=true;$("app").hidden=false;stopContent=onSnapshot(content,s=>{if(s.exists()&&Array.isArray(s.data().missions))missions=s.data().missions;render()},e=>$("cloud").textContent="Content error: "+e.message);stopAnswers=onSnapshot(ref,s=>{if(!ready){ready=true;if(s.exists()){answers=s.data().answers||{};page=Math.max(0,Math.min(missions.length-1,s.data().page||0))}render()}$("cloud").textContent="☁️ Connected. Your work saves automatically."},e=>$("cloud").textContent="⚠️ Saving unavailable: "+e.message)});function save(){if(!ready)return;clearTimeout(timer);$("cloud").textContent="⏳ Saving…";timer=setTimeout(async()=>{try{await setDoc(ref,{answers,page,updatedAt:Date.now()});$("cloud").textContent="☁️ Saved for Laura"}catch(e){$("cloud").textContent="⚠️ Not saved: "+e.message}},250)}function render(){const m=missions[page];if(!m)return;$("title").textContent=m[0];$("scene").textContent=m[0].split(" ")[0]+" 👻 🦇 🎃";$("story").textContent=m[1];$("count").textContent="Mission "+(page+1)+" of "+missions.length;$("progress").max=missions.length;$("progress").value=page+1;$("back").disabled=page===0;$("next").textContent=page===missions.length-1?"Finish 🏆":"Next mission →";$("questions").replaceChildren();m[2].forEach((q,i)=>{const h=document.createElement("h3");h.textContent=(i+1)+". "+q[0];$("questions").append(h);q[1].forEach((option,j)=>{const b=document.createElement("button");b.className="option"+(answers[page+":"+i]===j?" chosen":"");b.textContent=option;b.onclick=()=>{answers[page+":"+i]=j;save();render();$("feedback").textContent=Number.isInteger(q[2])?(j===q[2]?"🌟 Great reading!":"💜 Nice try! Sound it out and try again."):"✨ Thank you for sharing!"};$("questions").append(b)})});}$("back").onclick=()=>{if(page){page--;render();save();scrollTo(0,0)}};$("next").onclick=()=>{if(page<missions.length-1){page++;render();save();scrollTo(0,0)}else $("feedback").textContent="🏆 Amazing effort, Leen! You finished your adventure!"};</script></html>
